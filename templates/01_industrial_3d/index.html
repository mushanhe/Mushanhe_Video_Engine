<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial 3D Gallery · 组件展厅（风格包 01）</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../core/engine.css" />
  <style>
    :root {
      --id-font-cn: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --id-font-latin: 'Helvetica Neue', 'Arial', 'Noto Sans SC', sans-serif;
      --id-font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      --id-pearl: #F4F5F7; --id-steel: #2B2F36; --id-orange: #FF5A1F; --id-teal: #00C2A8;
      --id-ink: #15181D; --id-grey: #5E6672;
    }
    #viewport { background: var(--id-pearl); overflow: hidden; font-family: var(--id-font-cn); color: var(--id-ink); }
    #gallery-bg-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 4; pointer-events: none; }
    #avatar-morph-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 32; pointer-events: none; }

    /* 3D 画廊世界（透明，仅画 120px 建筑网格作为空间参照；底景由 core/gallery-bg.js 绘制） */
    #camera-viewport { position: absolute; inset: 0; z-index: 10; overflow: hidden; perspective: 1650px; pointer-events: none; background: transparent; }
    #ind-world {
      position: absolute; left: 0; top: 0; width: 11200px; height: 1300px; transform-style: preserve-3d; will-change: transform;
      background-image: linear-gradient(90deg, rgba(20,30,44,0.045) 1px, transparent 1px), linear-gradient(rgba(20,30,44,0.045) 1px, transparent 1px);
      background-size: 120px 120px;
    }
    /* 每个展位：后退 80px 的展台地脚线（橙色起点标记），漫游时提供景深参照 */
    .ind-bay { position: absolute; width: 1400px; height: 1100px; transform: translateZ(-80px); pointer-events: none; }
    .ind-bay .base { position: absolute; left: 40px; right: 40px; top: 1000px; height: 4px; border-radius: 2px; background: rgba(43,47,54,0.22); }
    .ind-bay .base::before { content: ''; position: absolute; left: 0; top: -3px; width: 90px; height: 10px; border-radius: 3px; background: var(--id-orange); }

    /* 展厅玻璃隔断转场（画廊漫游时从镜头前掠过） */
    #ind-partition {
      position: absolute; top: 0; left: 0; width: 360px; height: 1080px; z-index: 15; pointer-events: none; display: none;
      background: linear-gradient(90deg, rgba(255,255,255,0.62), rgba(236,240,244,0.88) 60%, rgba(255,255,255,0.7));
      backdrop-filter: blur(16px) saturate(1.1); -webkit-backdrop-filter: blur(16px) saturate(1.1);
      border-left: 8px solid var(--id-orange); box-shadow: inset -2px 0 0 var(--id-teal), -30px 0 60px rgba(20,26,34,0.22), 30px 0 60px rgba(20,26,34,0.22);
    }
    #ind-partition .no { position: absolute; left: 36px; top: 300px; font-family: var(--id-font-latin); font-size: 170px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; color: var(--id-orange); }
    #ind-partition .ex { position: absolute; left: 44px; top: 270px; font-family: var(--id-font-mono); font-size: 18px; font-weight: 800; letter-spacing: 0.3em; color: var(--id-grey); }
    #ind-partition .lb { position: absolute; left: 44px; top: 500px; font-size: 64px; font-weight: 900; color: var(--id-ink); writing-mode: vertical-rl; letter-spacing: 0.1em; }

    #screen-layer { position: absolute; inset: 0; z-index: 26; pointer-events: none; }

    /* 顶部 10 段磨砂玻璃胶囊标签（兼作进度） */
    #ind-tabs { position: absolute; left: 40px; top: 20px; z-index: 45; display: flex; gap: 4px; padding: 6px; border-radius: 999px;
      background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 1px rgba(20,26,34,0.06), 0 12px 24px -12px rgba(20,26,34,0.35); backdrop-filter: blur(10px); }
    .ind-tab { width: 116px; position: relative; padding: 6px 0 11px; box-sizing: border-box; border-radius: 999px; text-align: center; font-family: var(--id-font-mono); font-size: 12px; font-weight: 800; color: rgba(20,26,34,0.42); cursor: pointer; white-space: nowrap; overflow: hidden; }
    .ind-tab.done { color: rgba(20,26,34,0.75); }
    .ind-tab.on { background: var(--id-steel); color: #FFFFFF; }
    .ind-tab .tr { position: absolute; left: 14px; right: 14px; bottom: 4px; height: 3px; border-radius: 2px; background: rgba(20,26,34,0.1); }
    .ind-tab.on .tr { background: rgba(255,255,255,0.18); }
    .ind-tab .fl { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: var(--id-orange); }

    /* 人像：工业石墨边框 + 柔和落地阴影 + 剪影占位 */
    #avatar-stage { border-style: solid !important; border-color: var(--id-steel) !important; background: #E4E7EB !important;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.7), 0 10px 0 -2px #1D2025, 0 40px 70px -20px rgba(14,18,24,0.45) !important; }
    #avatar-stage.is-full { border-width: 0 !important; box-shadow: none !important; }
    #avatar-silhouette { position: absolute; left: 50%; bottom: 0; height: 80%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
    #avatar-tag { background: #111418 !important; color: #FFFFFF !important; border: 1px solid rgba(255,255,255,0.12) !important; border-radius: 999px !important; font-family: var(--id-font-mono) !important; font-weight: 800 !important; font-size: 14px !important; letter-spacing: 0.12em !important; padding: 9px 18px !important; box-shadow: 0 10px 20px -8px rgba(0,0,0,0.5) !important; backdrop-filter: none !important; }
    #avatar-tag i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--id-orange); box-shadow: 0 0 10px var(--id-orange); margin-right: 10px; }

    /* 高对比黑胶囊字幕条：#111418 胶囊 + 电光青指示灯 + 白字 + 爱马仕橙逐字高亮 */
    #subtitle-bar {
      bottom: 36px !important; background: #111418 !important; border: 1px solid rgba(255,255,255,0.10) !important; border-radius: 999px !important;
      backdrop-filter: none !important; box-shadow: 0 0 0 4px rgba(244,245,247,0.6), 0 18px 36px -10px rgba(14,18,24,0.6) !important;
      padding: 12px 42px 13px 66px !important; color: #FFFFFF !important; font-family: var(--id-font-cn) !important;
      font-size: 40px !important; font-weight: 900 !important; letter-spacing: 0.03em !important;
    }
    #subtitle-bar::before { content: ''; position: absolute; left: 30px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: #00C2A8; box-shadow: 0 0 12px #00C2A8; }
    #subtitle-bar .w { color: #FFFFFF; text-shadow: none; }
    #subtitle-bar .w.passed { color: #FFFFFF !important; text-shadow: none !important; }
    #subtitle-bar .w.active { color: #FF5A1F !important; text-shadow: none !important; }

    #load-error { position: absolute; left: 80px; top: 200px; z-index: 99; padding: 16px 26px; border-radius: 10px; background: #111418; color: #FF5A1F; font-size: 28px; font-weight: 900; display: none; }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="gallery-bg-canvas" width="1920" height="1080"></canvas>
    <div id="camera-viewport"><div id="ind-world"></div></div>
    <div id="ind-partition"><div class="ex">EXHIBIT</div><div class="no">01</div><div class="lb">—</div></div>
    <div id="screen-layer"></div>
    <div id="ind-tabs"></div>

    <div id="avatar-stage">
      <img id="avatar-studio-bg" src="assets/studio_bg.png" alt="studio" />
      <svg id="avatar-silhouette" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet">
        <circle cx="200" cy="150" r="92" fill="#2B2F36" />
        <path d="M30 520 C40 340 110 270 200 270 C290 270 360 340 370 520 Z" fill="#2B2F36" />
        <rect x="186" y="270" width="28" height="56" fill="#FF5A1F" />
        <text x="200" y="372" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="800" fill="#F4F5F7" letter-spacing="3">AVATAR · 人像占位</text>
      </svg>
      <div id="avatar-tag"><i></i><span id="avatar-tag-tx">YOUR NAME</span></div>
    </div>

    <canvas id="avatar-morph-canvas" width="1920" height="1080"></canvas>
    <div id="subtitle-bar"></div>
    <div id="load-error"></div>
  </div>

  <div id="hud">
    <button id="btn-play" class="primary">▶ 连播 10 大句型</button>
    <button id="btn-replay">↺ 重播</button>
    <input id="scrubber" type="range" min="0" max="50" step="0.01" value="0" />
    <span id="time-readout">0.00 / 0.00s</span>
    <span class="hud-sep"></span>
    <span class="hud-label">H 隐藏控制栏 · 1–9 / 0 切换句型 · 空格播放</span>
  </div>

  <script src="../../core/vendor/gsap.min.js"></script>
  <script src="../../core/camera-rig.js"></script>
  <script src="../../core/gallery-bg.js"></script>
  <script src="../../core/avatar-morph-fx.js"></script>
  <script src="../../core/avatar.js"></script>
  <script src="../../core/subtitle.js"></script>
  <script src="components.js"></script>
  <script>
    const vp = document.getElementById('viewport');
    function fit() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      vp.style.transform = `scale(${s})`;
      vp.style.left = `${(window.innerWidth - 1920 * s) / 2}px`;
      vp.style.top = `${(window.innerHeight - 1080 * s) / 2}px`;
    }
    window.addEventListener('resize', fit); fit();

    const ZONE_GAP = 200, ZONE_Y = 100, SX = 650, SY = 470;
    // 组件局部安全区 x60–1340 / y100–980 → 屏幕 x≈115–1295（避开人像框 1328+）/ y≈100–910（避开字幕）
    const CAM_DX = 60, CAM_ZOOM = 0.92;
    // 画廊漫游：段尾提前 GLIDE_OUT 起步，下一段 GLIDE_IN 后落位，中点拉远 + 侧摇，展位之间连续行走
    const GLIDE_OUT = 0.45, GLIDE_IN = 0.3;
    const params = new URLSearchParams(location.search);

    /** 把每段 sub[] 均匀铺成 core/subtitle.js 需要的 WORD_DATA（中文逐字、英文/数字成词） */
    function buildWordData(scenes) {
      const words = [], lines = [];
      scenes.forEach((sc) => {
        const subs = sc.sub || []; if (!subs.length) return;
        const a0 = sc.start + 0.35, a1 = sc.start + sc.dur - 0.3, slot = (a1 - a0) / subs.length;
        subs.forEach((line, li) => {
          const toks = line.match(/[A-Za-z0-9.\-_/@#:+]+|\s+|./g) || [];
          const real = toks.filter((x) => !/^\s+$/.test(x));
          const s0 = a0 + li * slot, dt = (slot - 0.25) / Math.max(1, real.length);
          const a = words.length, sp = [];
          let k = 0;
          toks.forEach((tk) => {
            if (/^\s+$/.test(tk)) { if (words.length > a) sp.push(words.length - 1); return; }
            words.push([tk, +(s0 + k * dt).toFixed(3), +(s0 + (k + 1) * dt).toFixed(3)]); k++;
          });
          if (words.length > a) lines.push({ a, b: words.length - 1, sp });
        });
      });
      return { words, lines };
    }

    async function boot() {
      let script;
      try {
        const src = params.get('data') || 'demo_data.json';
        script = await (await fetch(src, { cache: 'no-store' })).json();
      } catch (e) {
        const el = document.getElementById('load-error');
        el.style.display = 'block'; el.textContent = '剧本 JSON 加载失败：请用 python core/tools/serve.py 通过 HTTP 打开本页。';
        throw e;
      }
      const theme = script.theme || {};
      const root = document.documentElement.style;
      ['pearl', 'steel', 'orange', 'teal', 'ink'].forEach((k) => { if (theme[k]) root.setProperty(`--id-${k}`, theme[k]); });
      Industrial3D.injectCSS();

      // 人像：可选真人视频，否则用剪影占位
      const meta = script.meta || {}, av = meta.avatar || {};
      if (av.bg) document.getElementById('avatar-studio-bg').src = av.bg;
      document.getElementById('avatar-tag-tx').textContent = av.tag || 'YOUR NAME';
      if (av.video) {
        const v = document.createElement('video');
        v.id = 'avatar-video'; v.src = av.video; v.muted = true; v.playsInline = true; v.preload = 'auto';
        document.getElementById('avatar-stage').insertBefore(v, document.getElementById('avatar-tag'));
        document.getElementById('avatar-silhouette').style.display = 'none';
      }

      const world = document.getElementById('ind-world');
      const galleryBg = new MHEngine.GalleryBackground(document.getElementById('gallery-bg-canvas'));

      // 组装场景（每个 world 段配一个后退的展位）
      const scenes = []; let acc = 0, zoneX = 0;
      (script.scenes || []).forEach((sc, i) => {
        const factory = Industrial3D.COMPONENTS[sc.type];
        if (!factory) { console.warn('unknown scene type', sc.type); return; }
        const dur = sc.dur || 6;
        const comp = factory.create(sc.data || {}, { dur });
        const zx = zoneX, zy = ZONE_Y, zw = comp.w || 1400; zoneX += zw + ZONE_GAP;
                const bay = document.createElement('div');
        bay.className = 'ind-bay'; bay.style.left = `${zx}px`; bay.style.top = `${zy}px`; bay.style.width = `${zw}px`;
        bay.innerHTML = '<div class="base"></div>';
        world.appendChild(bay);
        if (comp.layer === 'screen') { comp.el.style.display = 'none'; document.getElementById('screen-layer').appendChild(comp.el); }
        else { comp.el.style.left = `${zx}px`; comp.el.style.top = `${zy}px`; world.appendChild(comp.el); }
        scenes.push({ ...sc, idx: i, start: acc, dur, comp, zx, zy, avatar: sc.avatar || comp.avatar });
        acc += dur;
      });
      const DURATION = acc;
      world.style.width = `${zoneX + 1400}px`;
      document.getElementById('scrubber').max = DURATION;

      // 运镜关键帧：每段局部机位 → 世界坐标；段与段之间画廊漫游（拉远 + 侧摇 + 玻璃隔断掠过）
      const perScene = scenes.map((s, i) => {
        const cams = s.comp.cams && s.comp.cams.length ? s.comp.cams : [{ t: 0, x: 700, y: 500, zoom: 1 }];
        const out = []; let prevT = -1;
        cams.forEach((c, j) => {
          let t = s.start + Math.min(c.t, s.dur);
          if (i > 0 && j === 0) t = s.start + GLIDE_IN;
          if (j === cams.length - 1 && i < scenes.length - 1) t = s.start + s.dur - GLIDE_OUT;
          if (t <= prevT) t = prevT + 0.01;
          prevT = t;
          out.push({ t, x: s.zx + c.x - CAM_DX, y: s.zy + c.y, zoom: (c.zoom || 1) * CAM_ZOOM, rx: c.rx || 0, ry: c.ry || 0, rz: c.rz || 0, screenX: SX, screenY: SY });
        });
        return out;
      });
      const kfs = [];
      perScene.forEach((list, i) => {
        kfs.push(...list);
        if (i < perScene.length - 1) {
          const a = list[list.length - 1], b = perScene[i + 1][0], tb = scenes[i + 1].start;
          kfs.push({ t: tb - 0.06, x: (a.x + b.x) / 2, y: ZONE_Y + 520, zoom: 0.6 * CAM_ZOOM, rx: 3, ry: -5, rz: 0, screenX: SX + 120, screenY: SY });
        }
      });
      const camRig = new MHEngine.CameraRig3D(world, { viewW: 1920, viewH: 1080, handheld: 0.55 });
      camRig.setKeyframes(kfs);

      // 人像形态：card / pip / corner / full（4 种形态全部走 core 点阵粒子散聚转场）
      const avatar = new MHEngine.AvatarController({
        card:   { left: 1328, top: 82,  width: 540, height: 790, borderRadius: 12,  borderWidth: 3, tagOpacity: 1 },
        pip:    { left: 1532, top: 642, width: 320, height: 320, borderRadius: 160, borderWidth: 4, tagOpacity: 0 },
        corner: { left: 1410, top: 530, width: 458, height: 342, borderRadius: 12,  borderWidth: 3, tagOpacity: 1 }
      });
      const mapAv = (m) => m === 'full' ? 'fullscreen' : (m === 'pip' || m === 'corner' ? m : 'card');
      const avatarMorph = new MHEngine.AvatarMorphFX(document.getElementById('avatar-morph-canvas'), avatar.presets);
      const tl = gsap.timeline({ paused: true });
      avatar.setImmediate(scenes[0] ? mapAv(scenes[0].avatar) : 'card');
      scenes.forEach((s, i) => {
        if (i === 0) return;
        const prev = mapAv(scenes[i - 1].avatar);
        const cur = mapAv(s.avatar);
        if (prev !== cur) {
          avatarMorph.addMorph({ time: s.start + 0.02, duration: 0.5, fromMode: prev, toMode: cur, count: 1000, seed: 10100 + i });
          avatar.animateOnTimeline(tl, cur, s.start + 0.06, 0.48);
        }
      });
      tl.to({}, { duration: 0.05 }, DURATION);

      // 字幕
      const WORD_DATA = buildWordData(scenes);
      window.WORD_DATA = WORD_DATA;
      const subtitle = new MHEngine.SubtitleRenderer(document.getElementById('subtitle-bar'), WORD_DATA);

      // 顶部句型标签
      const tabsEl = document.getElementById('ind-tabs');
      scenes.forEach((s, i) => {
        const tb = document.createElement('div'); tb.className = 'ind-tab';
        tb.innerHTML = `${String(i + 1).padStart(2, '0')} ${s.type.toUpperCase()}<div class="tr"><div class="fl"></div></div>`;
        tb.addEventListener('click', () => jumpTo(i));
        tabsEl.appendChild(tb); s.tab = tb;
      });

      const part = document.getElementById('ind-partition');
      const stageEl = document.getElementById('avatar-stage');
      const camViewport = document.getElementById('camera-viewport');
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

      function updateUI(t) {
        tl.time(Math.min(t, DURATION));
        galleryBg.render(t, 'swiss-pearl');
        camRig.render(t);
        subtitle.render(t);
        let cur = scenes.length - 1;
        scenes.forEach((s, i) => { if (t >= s.start && t < s.start + s.dur) cur = i; });
        scenes.forEach((s, i) => {
          if (Math.abs(i - cur) <= 1) s.comp.update(t - s.start);
          if (s.comp.layer === 'screen') s.comp.el.style.display = i === cur ? 'block' : 'none';
          s.tab.classList.toggle('on', i === cur);
          s.tab.classList.toggle('done', i < cur);
          s.tab.querySelector('.fl').style.width = `${(clamp01((t - s.start) / s.dur) * 100).toFixed(1)}%`;
        });
        const S = scenes[cur];
        const isFull = S.avatar === 'full';
        stageEl.classList.toggle('is-full', isFull && t >= S.start + 0.2);
        camViewport.style.opacity = isFull && t >= S.start + 0.15 && t < S.start + S.dur ? '0' : '1';

        // 玻璃隔断：画廊漫游期间从右向左掠过镜头前，带下一展位编号
        let shown = false;
        for (let i = 1; i < scenes.length; i++) {
          const b = scenes[i].start, a0 = b - GLIDE_OUT, a1 = b + GLIDE_IN;
          if (t >= a0 && t < a1) {
            const x = 1960 - 2380 * inOut(clamp01((t - a0) / (a1 - a0)));
            part.style.display = 'block';
            part.style.transform = `translateX(${x.toFixed(1)}px)`;
            part.querySelector('.no').textContent = String(i + 1).padStart(2, '0');
            part.querySelector('.lb').textContent = scenes[i].label || scenes[i].type;
            shown = true; break;
          }
        }
        if (!shown) part.style.display = 'none';

        stageEl.style.opacity = avatarMorph.render(t).toFixed(3);
        document.getElementById('scrubber').value = t.toFixed(2);
        document.getElementById('time-readout').textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)}s · ${String(cur + 1).padStart(2, '0')} ${S.type}`;
      }

      // 播放时钟（无音轨，按 performance.now 推进；有 avatar.video 时同步视频）
      let playing = false, t0 = 0, tStart = 0, cur = 0, raf = null;
      const vid = document.getElementById('avatar-video');
      function seek(t) {
        cur = Math.max(0, Math.min(DURATION, t)); updateUI(cur);
        scenes.forEach((s) => { const m = s.comp.media; if (m && m.tagName === 'VIDEO') { try { m.currentTime = Math.max(0, cur - s.start - 0.3) % (m.duration || 1e9); } catch (_) {} } });
        if (vid) { try { vid.currentTime = cur; } catch (_) {} }
        if (playing) { t0 = performance.now(); tStart = cur; }
      }
      function loop() {
        if (!playing) return;
        const t = tStart + (performance.now() - t0) / 1000;
        if (t >= DURATION) { pause(); seek(DURATION); return; }
        cur = t; updateUI(t); raf = requestAnimationFrame(loop);
      }
      function play() { if (cur >= DURATION - 0.05) cur = 0; playing = true; t0 = performance.now(); tStart = cur; if (vid) vid.play().catch(() => {}); scenes.forEach((s) => s.comp.media && s.comp.media.play && s.comp.media.play().catch(() => {})); document.getElementById('btn-play').textContent = '⏸ 暂停'; raf = requestAnimationFrame(loop); }
      function pause() { playing = false; cancelAnimationFrame(raf); if (vid) vid.pause(); scenes.forEach((s) => s.comp.media && s.comp.media.pause && s.comp.media.pause()); document.getElementById('btn-play').textContent = '▶ 连播 10 大句型'; }
      function jumpTo(i) { seek(scenes[i].start + 0.45); }

      document.getElementById('btn-play').addEventListener('click', () => playing ? pause() : play());
      document.getElementById('btn-replay').addEventListener('click', () => { seek(0); play(); });
      document.getElementById('scrubber').addEventListener('input', (e) => { pause(); seek(parseFloat(e.target.value)); });
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
        else if (e.key === 'h' || e.key === 'H') document.getElementById('hud').classList.toggle('hidden');
        else if (/^[0-9]$/.test(e.key)) { const k = e.key === '0' ? 9 : +e.key - 1; if (scenes[k]) jumpTo(k); }
      });

      window.__MH_ENGINE__ = { duration: DURATION, seek, scenes: scenes.map((s) => ({ type: s.type, start: s.start, dur: s.dur })) };
      if (params.get('clean') === '1') document.getElementById('hud').classList.add('hidden');
      seek(params.has('t') ? parseFloat(params.get('t')) : 0);
    }
    boot();
  </script>
</body>
</html>
