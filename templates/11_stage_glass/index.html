<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stage Glass 发布会流光玻璃 · 组件展厅（风格包 11）</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../core/engine.css" />
  <style>
    :root {
      --kg-font: 'Inter', 'Helvetica Neue', 'Segoe UI', 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --kg-font-latin: 'Inter', 'Helvetica Neue', 'Segoe UI', 'Arial', sans-serif;
      --kg-font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Menlo', monospace;
      --kg-bg: #050507; --kg-white: #F8FAFC; --kg-silver: #94A3B8;
      --kg-blue: #2563EB; --kg-violet: #7C3AED; --kg-cyan: #22D3EE; --kg-accent: #60A5FA;
    }
    #viewport { background: var(--kg-bg); overflow: hidden; font-family: var(--kg-font); color: var(--kg-white); }
    #avatar-morph-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 32; pointer-events: none; }

    /* 纯黑舞台 + 2 团极柔和缓慢呼吸的弥散极光光球（屏幕固定层，按时间确定性呼吸） */
    #kg-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--kg-bg); overflow: hidden; }
    .kg-orb-bg { position: absolute; border-radius: 50%; will-change: transform, opacity; }
    #kg-orb-a { left: -260px; top: -320px; width: 1500px; height: 1300px; background: radial-gradient(closest-side, rgba(37,99,235,.36), rgba(37,99,235,.12) 45%, rgba(37,99,235,0) 100%); }
    #kg-orb-b { left: 760px; top: 120px; width: 1500px; height: 1300px; background: radial-gradient(closest-side, rgba(124,58,237,.30), rgba(124,58,237,.10) 45%, rgba(124,58,237,0) 100%); }
    #kg-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; background: linear-gradient(180deg, rgba(5,5,7,0), rgba(5,5,7,.65)); }
    #kg-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 45% 45%, rgba(5,5,7,0) 55%, rgba(0,0,0,.55) 100%); }

    /* 3D 发布会画布（透明 · flat，以保证子级 backdrop-filter 毛玻璃可采样到极光底） */
    #camera-viewport { position: absolute; inset: 0; z-index: 10; overflow: hidden; perspective: 1800px; pointer-events: none; background: transparent; transform-origin: 50% 50%; }
    #kg-world { position: absolute; left: 0; top: 0; width: 11200px; height: 1300px; will-change: transform; }

    /* 标志转场：柔和极光光幕自左向右扫过 + 景深微缩放 */
    #kg-curtain { position: absolute; inset: 0; z-index: 15; pointer-events: none; display: none; overflow: hidden; }
    #kg-curtain .band { position: absolute; top: -120px; left: 0; width: 2600px; height: 1320px; mix-blend-mode: screen; filter: blur(46px);
      background: linear-gradient(90deg, rgba(37,99,235,0) 0%, rgba(37,99,235,.30) 22%, rgba(96,165,250,.42) 38%, rgba(167,139,250,.46) 52%, rgba(34,211,238,.34) 68%, rgba(34,211,238,0) 100%); }
    #kg-curtain .sheen { position: absolute; top: 0; bottom: 0; left: 0; width: 3px; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.65), rgba(255,255,255,0)); box-shadow: 0 0 40px 10px rgba(147,197,253,.35); }
    #kg-chap { position: absolute; left: 0; right: 0; top: 380px; text-align: center; opacity: 0; }
    #kg-chap .no { font-family: var(--kg-font-latin); font-size: 190px; font-weight: 200; letter-spacing: -.04em; line-height: 1; padding-bottom: .05em;
      background: linear-gradient(180deg, #FFFFFF, #94A3B8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #kg-chap .lb { margin-top: 14px; font-size: 30px; font-weight: 600; letter-spacing: .5em; text-indent: .5em; color: #CBD5E1; }

    #screen-layer { position: absolute; inset: 0; z-index: 26; pointer-events: none; }

    /* 顶部极简分段进度条 */
    #kg-nav { position: absolute; left: 64px; top: 30px; z-index: 45; display: flex; align-items: center; gap: 6px; }
    .kg-seg { width: 46px; height: 18px; display: flex; align-items: center; cursor: pointer; }
    .kg-seg b { position: relative; display: block; width: 100%; height: 3px; border-radius: 3px; background: rgba(148,163,184,.18); overflow: hidden; }
    .kg-seg b i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #60A5FA, #A78BFA, #22D3EE); }
    .kg-seg.done b { background: rgba(203,213,225,.55); }
    #kg-nav-tx { margin-left: 16px; font-family: var(--kg-font-latin); font-size: 15px; font-weight: 600; letter-spacing: .24em; color: var(--kg-silver); white-space: nowrap; }
    #kg-nav-tx b { color: #F8FAFC; font-weight: 600; margin-right: 12px; }

    /* 稳态人像：1px 银白亮边 + 柔和投影 */
    #avatar-stage { border-radius: 32px; border: 1px solid rgba(226,232,240,.22) !important; box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 80px rgba(37,99,235,.12); background: #050507; }
    #avatar-stage.is-full { border-color: transparent !important; box-shadow: none; }
    #avatar-silhouette { position: absolute; left: 50%; bottom: 0; height: 80%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
    #avatar-tag { left: 24px !important; bottom: 22px !important; background: rgba(10,12,20,.55) !important; border: 1px solid rgba(255,255,255,.20) !important; border-radius: 999px !important;
      font-family: var(--kg-font-latin) !important; font-size: 14px !important; font-weight: 600 !important; letter-spacing: .16em !important; padding: 8px 18px !important; color: #F8FAFC !important; }
    #avatar-tag i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #60A5FA; box-shadow: 0 0 10px #60A5FA; margin-right: 4px; }

    /* 极简深黑毛玻璃药丸字幕 + 1px 银白亮边 + 当前字极光青蓝 */
    #subtitle-bar {
      bottom: 40px !important; background: rgba(8,9,14,.66) !important; border: 1px solid rgba(226,232,240,.38) !important; border-radius: 999px !important;
      -webkit-backdrop-filter: blur(22px) saturate(150%) !important; backdrop-filter: blur(22px) saturate(150%) !important;
      box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14) !important;
      padding: 13px 44px 14px !important; color: #F8FAFC !important; font-family: var(--kg-font) !important;
      font-size: 38px !important; font-weight: 600 !important; letter-spacing: .03em !important;
    }
    #subtitle-bar .w { color: #F8FAFC; text-shadow: none; }
    #subtitle-bar .w.passed { color: #F8FAFC !important; text-shadow: none !important; }
    #subtitle-bar .w.active { color: #60A5FA !important; text-shadow: 0 0 18px rgba(96,165,250,.55) !important; }

    #load-error { position: absolute; left: 80px; top: 200px; z-index: 99; padding: 16px 24px; border-radius: 16px; background: rgba(239,68,68,.15); border: 1px solid #F87171; color: #fff; font-size: 26px; font-weight: 600; display: none; }

    /* v3.5 · 跟词组件（core/cue-kit.js）的 11 造型：纯黑舞台上的液态毛玻璃 Bento——1px 亮边 + 顶部高光线 + 28px 大圆角 + 极光（蓝→紫→青）点睛，完全不歪（只在剧本写了新字段时出现） */
    :root {
      --mk-ink: var(--kg-white); --mk-paper: var(--kg-bg); --mk-panel: rgba(255,255,255,.06); --mk-muted: rgba(255,255,255,.035); --mk-muted-ink: #8391A7;
      --mk-c1: rgba(37,99,235,.24); --mk-on1: var(--kg-white); --mk-c2: rgba(124,58,237,.26); --mk-on2: var(--kg-white);
      --mk-c3: rgba(34,211,238,.16); --mk-on3: var(--kg-white); --mk-c4: rgba(255,255,255,.075); --mk-on4: var(--kg-white);
      --mk-accent: var(--kg-accent); --mk-dark: rgba(10,12,20,.72); --mk-on-dark: var(--kg-white);
      --mk-bw: 1px; --mk-rad: 28px; --mk-tilt: 0;
      --mk-sh: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14);
      --mk-sh-lg: 0 34px 90px rgba(0,0,0,.55), 0 0 60px rgba(96,165,250,.10), inset 0 1px 0 rgba(255,255,255,.16);
      --mk-sh-sm: 0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
      --mk-font: var(--kg-font); --mk-font-num: var(--kg-font-latin);
      --mk-tex: linear-gradient(180deg, rgba(255,255,255,.085) 0%, rgba(255,255,255,.02) 100%);
      --mk-board: rgba(255,255,255,.03); --mk-board-tex: none; --mk-tape: rgba(255,255,255,.12);
      --mk-trim: rgba(255,255,255,.07); --mk-trim-c: rgba(255,255,255,.5);
      /* 全屏画框：舞台上的发光玻璃屏——1px 银白亮边 + 32px 圆角 + 深投影与极光外晕 */
      --mh-frame-bw: 1px; --mh-frame-color: rgba(226,232,240,.38); --mh-frame-radius: 32;
      --mh-frame-shadow: 0 40px 100px rgba(0,0,0,.65), 0 0 90px rgba(37,99,235,.22); --mh-frame-vig: .3;
    }
    .mk-zone .mk-box { border-color: rgba(255,255,255,.15); -webkit-backdrop-filter: blur(28px) saturate(160%); backdrop-filter: blur(28px) saturate(160%); }
    .mk-zone .mk-head { background: linear-gradient(180deg,#FFFFFF 0%,#EEF2F7 38%,#B4C0D0 78%,#8A98AD 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
    /* 顶部高光线（玻璃磁贴的标志）：常态 + 卡片细节（trim）都用它，替代直角 L 角标 */
    .mk-zone .mk-ticket::after, .mk-zone .mk-cmp::after, .mk-zone .mk-cstat::after, .mk-zone .mk-file::after, .mk-zone .mk-plate::after,
    html[data-mh-card="trim"] .mk-zone .mk-ticket::after, html[data-mh-card="trim"] .mk-zone .mk-cmp::after, html[data-mh-card="trim"] .mk-zone .mk-cstat::after,
    html[data-mh-card="trim"] .mk-zone .mk-file::after, html[data-mh-card="trim"] .mk-zone .mk-plate::after {
      content: ''; position: absolute; inset: auto; left: 28px; right: 28px; top: -1px; height: 1px; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); }
    .mk-zone .mh-focus-ring { inset: -12px; border: 2px solid rgba(147,197,253,.9); border-radius: calc(var(--mk-rad) + 12px); box-shadow: 0 0 40px rgba(96,165,250,.45), inset 0 0 24px rgba(96,165,250,.14); }
    html[data-mh-card="trim"] .mk-zone .mh-focus-ring:not(.row) { box-shadow: 0 0 46px 6px rgba(96,165,250,.42), inset 0 0 24px rgba(167,139,250,.16); }
    .mk-stamp { padding: 12px 36px 14px; background: rgba(10,12,20,.62); color: #F8FAFC; border: 1.5px solid rgba(147,197,253,.75); border-radius: 999px; outline: none; font-weight: 800;
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 0 60px rgba(96,165,250,.35), 0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2); }
    .mk-sticker { padding: 12px 30px 14px; background: linear-gradient(120deg, #3B82F6, #7C3AED); color: #FFFFFF; border: 0; border-radius: 999px; font-weight: 800; box-shadow: 0 10px 40px rgba(59,130,246,.45), inset 0 1px 0 rgba(255,255,255,.35); }
    .mk-tape { border: 1px solid rgba(255,255,255,.22); border-radius: 10px; background-image: none; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
    .mk-arrow { color: rgba(203,213,225,.7); }
    /* cover：钛金属大字 + 玻璃球 + 胶囊 */
    .mk-cv-block { background-image: var(--mk-tex); background-size: auto; }
    .mk-cv-title span { background: linear-gradient(180deg,#FFFFFF 0%,#EEF2F7 38%,#B4C0D0 78%,#8A98AD 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
    .mk-cv-blue { color: #BFDBFE; }
    .mk-cv-dots { background-color: rgba(255,255,255,.04); background-image: radial-gradient(rgba(148,163,184,.28) 1.6px, transparent 1.6px); }
    .mk-cv-chip { border: 1px solid rgba(255,255,255,.16); border-radius: 999px; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
    .mk-cv-ring { border: 1px solid rgba(255,255,255,.2); box-shadow: inset 0 0 40px rgba(96,165,250,.22), inset -14px -20px 50px rgba(124,58,237,.28), 0 30px 90px rgba(37,99,235,.28);
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.10) 18%, rgba(255,255,255,0) 40%), radial-gradient(circle at 70% 78%, rgba(34,211,238,.35) 0%, rgba(124,58,237,.18) 38%, rgba(5,5,7,0) 72%), rgba(255,255,255,.03); }
    .mk-cv-ring::after { display: none; }
    .mk-cv-wave path { stroke: var(--kg-cyan); stroke-width: 3; stroke-linecap: round; }
    /* steps / intake */
    .mk-ticket .no { background: rgba(255,255,255,.06); color: #CBD5E1; font-weight: 300; border-right: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(255,255,255,.12); }
    .mk-ticket .ico { color: #BFDBFE; opacity: .85; }
    .mk-ticket .pgb { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; }
    .mk-ticket .pgb i { background: linear-gradient(90deg, var(--kg-accent), #A78BFA, var(--kg-cyan)); box-shadow: 0 0 14px var(--kg-accent); }
    html[data-mh-card="trim"] .mk-ticket .pgb::before { background: #FFFFFF; box-shadow: 0 0 10px #FFFFFF; }
    .mk-file .ear { display: none; }
    .mk-file .ic { color: #BFDBFE; }
    .mk-ai { border-color: rgba(147,197,253,.5) !important; }
    .mk-ai b { background: linear-gradient(90deg, var(--kg-accent) 0%, #A78BFA 52%, var(--kg-cyan) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .04em .06em; }
    .mk-ai .mini { color: #CBD5E1; }
    .mk-ai .mini u { border: 1px solid rgba(255,255,255,.22); border-radius: 999px; background: repeating-linear-gradient(-45deg, rgba(96,165,250,.75) 0 7px, rgba(167,139,250,.15) 7px 14px); }
    .mk-ai.lit { box-shadow: var(--mk-sh-lg), 0 0 60px 16px rgba(96,165,250,.38); }
    /* compare */
    .mk-cmp.wrong { border-color: rgba(255,255,255,.07); }
    .mk-cmp.right { border-color: rgba(147,197,253,.42); box-shadow: 0 34px 90px rgba(0,0,0,.55), 0 0 70px rgba(96,165,250,.2), inset 0 1px 0 rgba(255,255,255,.18); }
    .mk-cmp.right .t { background: linear-gradient(180deg,#FFFFFF 0%,#EEF2F7 38%,#B4C0D0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
    .mk-cmp.wrong .rw { color: #94A3B8; }
    .mk-cmp .rw i { width: 14px; height: 14px; border: 0; border-radius: 50%; background: linear-gradient(135deg, var(--kg-accent), var(--kg-violet)); box-shadow: 0 0 12px var(--kg-accent); }
    .mk-cmp.wrong .rw i { background: #475569; box-shadow: none; }
    .mk-cmp .badge { border: 0; border-radius: 50%; background: linear-gradient(135deg, var(--kg-accent), var(--kg-violet)); color: #FFFFFF; box-shadow: 0 0 30px rgba(96,165,250,.55); }
    .mk-cmp .sw { border: 1px solid rgba(255,255,255,.2); border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
    .mk-cmp .sw i { border-left: 1px solid rgba(255,255,255,.2); }
    .mk-cmp .btn { border: 0; border-radius: 999px; background: linear-gradient(120deg, #3B82F6, #7C3AED); color: #FFFFFF; font-weight: 700; box-shadow: 0 10px 40px rgba(59,130,246,.45), inset 0 1px 0 rgba(255,255,255,.35); }
    .mk-cmp .tlx { border: 1px solid rgba(255,255,255,.14); border-radius: 16px; background: rgba(255,255,255,.04); }
    .mk-cmp .tlx .trk { border-bottom: 1px solid rgba(255,255,255,.08); }
    .mk-cmp .tlx .clp { border: 0; border-radius: 6px; }
    .mk-cmp .tlx .ph { width: 3px; background: #FFFFFF; box-shadow: 0 0 12px var(--kg-accent); }
    .mk-vs .dm { transform: none; border-radius: 50%; background: rgba(10,12,20,.6); border: 1px solid rgba(255,255,255,.2); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 0 40px rgba(96,165,250,.25); }
    .mk-vs .tx { font-weight: 300; color: #CBD5E1; }
    .mk-ripple { border: 2px solid rgba(147,197,253,.9); box-shadow: 0 0 24px rgba(96,165,250,.5); }
    .mk-cstat { border-color: rgba(147,197,253,.4); }
    .mk-cstat .lb { background: rgba(255,255,255,.07); color: #CBD5E1; font-weight: 600; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; }
    .mk-cstat .num b { background: linear-gradient(90deg, var(--kg-accent) 0%, #A78BFA 52%, var(--kg-cyan) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .05em; }
    .mk-cstat .num .u { color: #CBD5E1; }
    .mk-cstat .pg { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; }
    .mk-cstat .pg i { background: linear-gradient(90deg, var(--kg-accent), #A78BFA, var(--kg-cyan)); box-shadow: 0 0 16px var(--kg-accent); }
    /* outro：玻璃底板 + 玻璃铭牌 + 极光 CTA 横条 */
    .mk-board { border-color: rgba(255,255,255,.09) !important; }
    .mk-screw { display: none; }
    .mk-plate .ic { color: #BFDBFE; }
    .mk-banner { background: linear-gradient(120deg, #3B82F6, #7C3AED 60%, #06B6D4); color: #FFFFFF; border-radius: 999px; font-weight: 700; box-shadow: 0 16px 50px rgba(59,130,246,.45), inset 0 1px 0 rgba(255,255,255,.4); }
    .mk-banner .ar { color: #FFFFFF; }
      /* v3.5 收尾（12 套打分）：「换风格」色块点击前用本包的亮色，不在深色卡上像三个空格 */
    :root { --mk-sw0: var(--kg-white); --mk-sw1: var(--kg-accent); --mk-sw2: var(--kg-cyan); --mk-sw3: var(--kg-violet); }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="kg-bg"><div class="kg-orb-bg" id="kg-orb-a"></div><div class="kg-orb-bg" id="kg-orb-b"></div><div id="kg-floor"></div><div id="kg-vignette"></div></div>
    <div id="camera-viewport"><div id="kg-world"></div></div>
    <div id="kg-curtain">
      <div class="band"></div><div class="sheen"></div>
      <div id="kg-chap"><div class="no">01</div><div class="lb">—</div></div>
    </div>
    <div id="screen-layer"></div>
    <div id="kg-nav"></div>

    <div id="avatar-stage">
      <img id="avatar-studio-bg" src="assets/studio_bg.png" alt="studio" />
      <svg id="avatar-silhouette" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="kg-sil-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E293B" /><stop offset="1" stop-color="#0B0F1A" /></linearGradient>
          <linearGradient id="kg-sil-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA" /><stop offset=".55" stop-color="#A78BFA" /><stop offset="1" stop-color="#22D3EE" /></linearGradient>
        </defs>
        <circle cx="200" cy="150" r="88" fill="url(#kg-sil-fill)" stroke="url(#kg-sil-rim)" stroke-width="2" />
        <path d="M30 520 C40 340 110 272 200 272 C290 272 360 340 370 520 Z" fill="url(#kg-sil-fill)" stroke="url(#kg-sil-rim)" stroke-width="2" />
        <text x="200" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#94A3B8" letter-spacing="5">AVATAR · 人像占位</text>
      </svg>
      <div id="avatar-tag"><i></i><span id="avatar-tag-tx">YOUR NAME</span></div>
    </div>

    <canvas id="avatar-morph-canvas" width="1920" height="1080"></canvas>
    <div id="subtitle-bar"></div>
    <div id="load-error"></div>
  </div>

  <div id="hud">
    <button id="btn-play" class="primary">▶ 连播 10 大句型</button>
    <button id="btn-replay">↺ 重播</button>
    <input id="scrubber" type="range" min="0" max="50" step="0.01" value="0" />
    <span id="time-readout">0.00 / 0.00s</span>
    <span class="hud-sep"></span>
    <span class="hud-label">H 隐藏控制栏 · 1–9 / 0 切换句型 · 空格播放</span>
  </div>

  <script src="../../core/vendor/gsap.min.js"></script>
  <script src="../../core/camera-rig.js"></script>
  <script src="../../core/avatar-morph-fx.js"></script>
  <script src="../../core/avatar.js"></script>
  <script src="../../core/subtitle.js"></script>
  <script src="../../core/script-sync.js"></script>
  <script src="../../core/talk.js"></script>
  <script src="../../core/focus.js"></script>
  <script src="../../core/cue-kit.js"></script>
  <script src="../../core/host-kit.js"></script>
  <script src="components.js"></script>
  <script>
    const vp = document.getElementById('viewport');
    function fit() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      vp.style.transform = `scale(${s})`;
      vp.style.left = `${(window.innerWidth - 1920 * s) / 2}px`;
      vp.style.top = `${(window.innerHeight - 1080 * s) / 2}px`;
    }
    window.addEventListener('resize', fit); fit();

    const ZONE_GAP = 200, ZONE_Y = 100, SX = 650, SY = 470;
    // 组件局部安全区 x60–1340 / y100–980 → 屏幕 x≈115–1295（避开人像框 1328+）/ y≈100–910（避开字幕）
    const CAM_DX = 60, CAM_ZOOM = 0.92;
    const params = new URLSearchParams(location.search);
    // v3.5：牌子层 11 造型（印章 = 极光亮边毛玻璃胶囊、贴纸 = 蓝紫渐变胶囊、标签 = 深色毛玻璃标题牌、多色大字 = 极光三色无描边带辉光；全部不歪）
    MHEngine.Badges.registerKinds('11', {
      stamp: 'padding:12px 38px 14px;background:rgba(10,12,20,.62);color:#F8FAFC;border:1.5px solid rgba(147,197,253,.8);border-radius:999px;box-shadow:0 0 60px rgba(96,165,250,.38),0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);font-family:var(--kg-font);font-weight:800;',
      sticker: 'padding:12px 32px 14px;background:linear-gradient(120deg,#3B82F6,#7C3AED);color:#FFFFFF;border-radius:999px;box-shadow:0 10px 40px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.35);font-family:var(--kg-font);font-weight:800;',
      tag: 'padding:14px 36px 16px;background:rgba(14,16,26,.66);color:#F8FAFC;border:1px solid rgba(226,232,240,.3);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 50px rgba(96,165,250,.2),inset 0 1px 0 rgba(255,255,255,.2);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);font-family:var(--kg-font);font-weight:800;',
      label: 'padding:16px 40px 18px;background:rgba(255,255,255,.08);color:#F8FAFC;border:1px solid rgba(255,255,255,.22);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);font-family:var(--kg-font);font-weight:800;',
      big: { pal: ['#60A5FA', '#A78BFA', '#22D3EE', '#F8FAFC'], ink: 'transparent', shadow: '0 0 34px rgba(96,165,250,.55)' },
      rot: { stamp: 0, sticker: 0, tag: 0, label: 0, big: 0 }
    });
    // 「换风格」按钮的样色（只在 compare 写了 right.button 时用）：玻璃 / 极光 / 冷银
    MHEngine.CueKit.swatches = [['#050507', '#60A5FA', '#A78BFA', '#22D3EE'], ['#0B1220', '#2563EB', '#7C3AED', '#F8FAFC'], ['#1E293B', '#22D3EE', '#94A3B8', '#E2E8F0']];

    /** 把每段 sub[] 均匀铺成 core/subtitle.js 需要的 WORD_DATA（中文逐字、英文/数字成词） */
    function buildWordData(scenes) {
      const words = [], lines = [];
      scenes.forEach((sc) => {
        if (MHEngine.ScriptSync.pushWords(sc, words, lines)) return; // 真实词级时间轴优先，否则均分
        const subs = sc.sub || []; if (!subs.length) return;
        const a0 = sc.start + 0.35, a1 = sc.start + sc.dur - 0.3, slot = (a1 - a0) / subs.length;
        subs.forEach((line, li) => {
          const toks = line.match(/[A-Za-z0-9.\-_/@#:+]+|\s+|./g) || [];
          const real = toks.filter((x) => !/^\s+$/.test(x));
          const s0 = a0 + li * slot, dt = (slot - 0.25) / Math.max(1, real.length);
          const a = words.length, sp = [];
          let k = 0;
          toks.forEach((tk) => {
            if (/^\s+$/.test(tk)) { if (words.length > a) sp.push(words.length - 1); return; }
            words.push([tk, +(s0 + k * dt).toFixed(3), +(s0 + (k + 1) * dt).toFixed(3)]); k++;
          });
          if (words.length > a) lines.push({ a, b: words.length - 1, sp });
        });
      });
      return { words, lines };
    }

    async function boot() {
      let script;
      try {
        const src = params.get('data') || 'demo_data.json';
        script = await (await fetch(src, { cache: 'no-store' })).json();
        MHEngine.ScriptSync.resolveMedia(script, src); // v3.4：媒体路径以剧本文件为基准
      } catch (e) {
        const el = document.getElementById('load-error');
        el.style.display = 'block'; el.textContent = '剧本 JSON 加载失败：请用 python core/tools/serve.py 通过 HTTP 打开本页。';
        throw e;
      }
      const theme = script.theme || {};
      const root = document.documentElement.style;
      ['bg', 'white', 'silver', 'blue', 'violet', 'cyan', 'accent'].forEach((k) => { if (theme[k]) root.setProperty(`--kg-${k}`, theme[k]); });
      StageGlass.injectCSS();
      const HK = MHEngine.HostKit.init(script, document.getElementById('avatar-stage'));   // v3.5：铺满版式 / 画框 / 利落散聚 / 牌子层（剧本写了才开）

      // 人像：可选真人视频，否则用剪影占位
      const meta = script.meta || {}, av = meta.avatar || {};
      if (av.bg) document.getElementById('avatar-studio-bg').src = av.bg;
      document.getElementById('avatar-tag-tx').textContent = av.tag || (av.video ? '' : 'YOUR NAME');
      if (av.video && !String(av.tag || '').trim()) document.getElementById('avatar-tag').style.display = 'none';   // v3.5：真人素材没填名牌 → 整块不出（占位剪影仍配占位名）
      if (av.video) {
        const v = document.createElement('video');
        v.id = 'avatar-video'; v.src = av.video; v.muted = true; v.playsInline = true; v.preload = 'auto';
        document.getElementById('avatar-stage').insertBefore(v, document.getElementById('avatar-tag'));
        document.getElementById('avatar-silhouette').style.display = 'none';
      }

      // 组装场景
      const world = document.getElementById('kg-world');
      const scenes = []; let acc = 0, zoneX = 0;
      const COVER_AT = HK.coverAt(script.scenes, 0.5);   // 极光光幕在段边界前 0.5s（PRE）开始扫入、画面开始虚化
      (script.scenes || []).forEach((sc, i) => {
        const factory = StageGlass.COMPONENTS[sc.type] || MHEngine.ScriptSync.coreComponent(sc.type);
        if (!factory) { console.warn('unknown scene type', sc.type); return; }
        const dur = sc.dur || 6;
        const ctx = MHEngine.ScriptSync.sceneCtx(sc, acc, dur);
        ctx.area = HK.area(sc, { CAM_DX, CAM_ZOOM, SX, SY }); ctx.coverAt = COVER_AT[i];
        const comp = MHEngine.CueKit.create(sc.type, sc.data, ctx) || factory.create(sc.data || {}, ctx);
        const badges = HK.badges(sc, comp, ctx, document.getElementById('screen-layer'));
        const zx = zoneX, zy = ZONE_Y; zoneX += (comp.w || 1400) + ZONE_GAP;
        if (comp.layer === 'screen') { comp.el.style.display = 'none'; document.getElementById('screen-layer').appendChild(comp.el); }
        else { comp.el.style.left = `${zx}px`; comp.el.style.top = `${zy}px`; world.appendChild(comp.el); }
        scenes.push({ ...sc, idx: i, start: acc, dur, comp, badges, zx, zy, avatar: sc.avatar || comp.avatar });
        acc += dur;
      });
      const DURATION = acc;
      world.style.width = `${zoneX + 1400}px`;
      document.getElementById('scrubber').max = DURATION;

      // 运镜关键帧：每段局部机位 → 世界坐标；段与段之间在极光光幕 + 景深虚化下切换
      const kfs = [];
      scenes.forEach((s, i) => {
        const cams = s.comp.cams && s.comp.cams.length ? s.comp.cams : [{ t: 0, x: 700, y: 500, zoom: 1 }];
        cams.forEach((c, j) => {
          let t = s.start + Math.min(c.t, s.dur);
          if (j === cams.length - 1 && i < scenes.length - 1) t = s.start + s.dur - 0.002;
          kfs.push({ t, x: s.zx + c.x - CAM_DX, y: s.zy + c.y, zoom: (c.zoom || 1) * CAM_ZOOM, rx: c.rx || 0, ry: c.ry || 0, rz: c.rz || 0, screenX: SX, screenY: SY });
        });
      });
      const camRig = new MHEngine.CameraRig3D(world, { viewW: 1920, viewH: 1080, handheld: 0.35 });
      camRig.setKeyframes(kfs);

      // 人像形态：card / pip / corner / full（4 种形态全部支持 core 点阵粒子散聚转场）
      const avatar = new MHEngine.AvatarController(HK.presets({
        card:   { left: 1328, top: 82,  width: 540, height: 790, borderRadius: 32,  borderWidth: 1, tagOpacity: 1 },
        pip:    { left: 1532, top: 642, width: 320, height: 320, borderRadius: 160, borderWidth: 1, tagOpacity: 0 },
        corner: { left: 1410, top: 530, width: 458, height: 342, borderRadius: 26,  borderWidth: 1, tagOpacity: 1 }
      }));
      const mapAv = (m) => m === 'full' ? 'fullscreen' : (m === 'pip' || m === 'corner' ? m : 'card');
      const avatarMorph = new MHEngine.AvatarMorphFX(document.getElementById('avatar-morph-canvas'), avatar.presets);
      const tl = gsap.timeline({ paused: true });
      const AVSEG = MHEngine.ScriptSync.avatarSegments(scenes); // 无 avatarCues 时与 scenes 一一对应
      avatar.setImmediate(scenes[0] ? mapAv(scenes[0].avatar) : 'card');
      if (!HK.scheduleMorphs({ segs: AVSEG, avatar, morph: avatarMorph, tl, mapAv, seed: 110100 })) AVSEG.forEach((s, i) => {
        if (i === 0) return;
        const prev = mapAv(AVSEG[i - 1].avatar);
        const cur = mapAv(s.avatar);
        if (prev !== cur) {
          avatarMorph.addMorph({ time: s.start + 0.02, duration: 0.56, fromMode: prev, toMode: cur, count: 1100, seed: 110100 + i });
          avatar.animateOnTimeline(tl, cur, s.start + 0.06, 0.52);
        }
      });
      tl.to({}, { duration: 0.05 }, DURATION);

      // 字幕
      const WORD_DATA = buildWordData(scenes);
      window.WORD_DATA = WORD_DATA;
      const subtitle = new MHEngine.SubtitleRenderer(document.getElementById('subtitle-bar'), WORD_DATA);

      // 顶部分段进度
      const nav = document.getElementById('kg-nav');
      scenes.forEach((s, i) => {
        const sg = document.createElement('div'); sg.className = 'kg-seg';
        sg.innerHTML = '<b><i></i></b>';
        sg.addEventListener('click', () => jumpTo(i));
        nav.appendChild(sg); s.seg = sg;
      });
      const navTx = document.createElement('div'); navTx.id = 'kg-nav-tx'; nav.appendChild(navTx);

      const curtain = document.getElementById('kg-curtain');
      const band = curtain.querySelector('.band'), sheen = curtain.querySelector('.sheen');
      const chap = document.getElementById('kg-chap');
      const orbA = document.getElementById('kg-orb-a'), orbB = document.getElementById('kg-orb-b');
      const stageEl = document.getElementById('avatar-stage');
      const camViewport = document.getElementById('camera-viewport');
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const easeOut = (x) => 1 - Math.pow(1 - x, 3), easeIn = (x) => x * x * x;
      const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const PRE = 0.5, POST = 0.7;

      function updateUI(t) {
        MHEngine.ScriptSync.renderCues(script, t);
        tl.time(Math.min(t, DURATION));
        camRig.render(t);
        subtitle.render(t);
        // 极光光球缓慢呼吸 + 漂移（纯 transform / opacity，确定性）
        orbA.style.transform = `translate(${(60 * Math.sin(t * 0.17)).toFixed(1)}px, ${(40 * Math.cos(t * 0.13)).toFixed(1)}px) scale(${(1 + 0.06 * Math.sin(t * 0.42)).toFixed(4)})`;
        orbA.style.opacity = (0.82 + 0.18 * Math.sin(t * 0.42 + 0.6)).toFixed(3);
        orbB.style.transform = `translate(${(-70 * Math.sin(t * 0.15 + 1.3)).toFixed(1)}px, ${(-36 * Math.cos(t * 0.19 + 0.4)).toFixed(1)}px) scale(${(1 + 0.07 * Math.sin(t * 0.36 + 2.1)).toFixed(4)})`;
        orbB.style.opacity = (0.8 + 0.2 * Math.sin(t * 0.36 + 2.7)).toFixed(3);

        let cur = scenes.length - 1;
        scenes.forEach((s, i) => { if (t >= s.start && t < s.start + s.dur) cur = i; });
        scenes.forEach((s, i) => {
          if (Math.abs(i - cur) <= 1) s.comp.update(t - s.start);
          if (s.comp.layer === 'screen') s.comp.el.style.display = i === cur ? 'block' : 'none';
          s.seg.classList.toggle('done', i < cur);
          s.seg.querySelector('i').style.width = i === cur ? `${(clamp01((t - s.start) / s.dur) * 100).toFixed(1)}%` : '0%';
        });
        const S = scenes[cur];
        const AS = MHEngine.ScriptSync.avatarAt(AVSEG, t, S);
        navTx.innerHTML = `<b>${String(cur + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}</b>${HK.label(S).toUpperCase()}`;
        const isFull = AS.avatar === 'full';
        stageEl.classList.toggle('is-full', isFull && t >= AS.start + HK.fullDelay(0.2));
        let camOp = isFull && t >= AS.start + HK.fullDelay(0.15) && t < AS.start + AS.dur ? 0 : 1;
        HK.updateBadges(scenes, cur, t);

        // 极光光幕扫过 + 景深微缩放：旧画面后退虚化 → 光幕盖过 → 新画面由近及远清晰落位
        let tr = -1;
        for (let i = 1; i < scenes.length; i++) { const b = scenes[i].start; if (t >= b - PRE && t < b + POST) { tr = i; break; } }
        if (tr > 0) {
          const b = scenes[tr].start;
          const u = easeInOut(clamp01((t - (b - PRE)) / (PRE + POST)));
          const bx = -2700 + u * (1920 + 2900);
          band.style.transform = `translateX(${bx.toFixed(1)}px)`;
          sheen.style.transform = `translateX(${(bx + 1300).toFixed(1)}px)`;
          sheen.style.opacity = (Math.sin(u * Math.PI) * 0.9).toFixed(3);
          band.style.opacity = (0.35 + 0.65 * Math.sin(u * Math.PI)).toFixed(3);
          const k = t < b ? easeIn(clamp01((t - (b - PRE)) / PRE)) : 1 - easeOut(clamp01((t - b) / POST));
          camOp *= 1 - k;
          camViewport.style.filter = k > 0.01 ? `blur(${(k * 16).toFixed(1)}px)` : '';
          camViewport.style.transform = `scale(${(t < b ? 1 - 0.05 * k : 1 + 0.06 * k).toFixed(4)})`;
          const co = t < b ? clamp01((t - (b - 0.32)) / 0.3) : 1 - clamp01((t - b - 0.18) / 0.4);
          chap.style.opacity = co.toFixed(3);
          chap.style.transform = `scale(${(0.96 + 0.04 * u).toFixed(4)})`;
          chap.querySelector('.no').textContent = String(tr + 1).padStart(2, '0');
          chap.querySelector('.no').style.display = HK.CHROME_OFF && !scenes[tr].label ? 'none' : '';   // v3.5：导出时没写 label 不出章节号 / 英文句型名，只留极光光幕
          chap.querySelector('.lb').textContent = HK.label(scenes[tr]);
          curtain.style.display = 'block';
        } else {
          curtain.style.display = 'none';
          camViewport.style.filter = '';
          camViewport.style.transform = '';
        }
        camViewport.style.opacity = camOp >= 0.999 ? '' : camOp.toFixed(3);

        stageEl.style.opacity = avatarMorph.render(t).toFixed(3);
        HK.frame(t, stageEl, avatarMorph);
        document.getElementById('scrubber').value = t.toFixed(2);
        document.getElementById('time-readout').textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)}s · ${String(cur + 1).padStart(2, '0')} ${S.type}`;
      }

      // 播放时钟（无音轨，按 performance.now 推进；有 avatar.video 时同步视频）
      let playing = false, t0 = 0, tStart = 0, cur = 0, raf = null;
      const vid = document.getElementById('avatar-video');
      const CLOCK = MHEngine.ScriptSync.mediaClock({ meta, duration: DURATION, video: vid, scenes }); // meta.avatar.offset + meta.audio
      function seek(t) {
        cur = Math.max(0, Math.min(DURATION, t)); updateUI(cur);
        scenes.forEach((s) => { const m = s.comp.media; if (m && m.tagName === 'VIDEO') { try { m.currentTime = Math.max(0, cur - s.start - 0.3) % (m.duration || 1e9); } catch (_) {} } });
        CLOCK.seek(cur);
        if (playing) { t0 = performance.now(); tStart = cur; }
      }
      function loop() {
        if (!playing) return;
        const t = CLOCK.now(tStart + (performance.now() - t0) / 1000); CLOCK.follow(t);
        if (t >= DURATION) { pause(); seek(DURATION); return; }
        cur = t; updateUI(t); raf = requestAnimationFrame(loop);
      }
      function play() { if (cur >= DURATION - 0.05) cur = 0; playing = true; t0 = performance.now(); tStart = cur; CLOCK.play(cur); scenes.forEach((s) => s.comp.media && s.comp.media.play && s.comp.media.play().catch(() => {})); document.getElementById('btn-play').textContent = '⏸ 暂停'; raf = requestAnimationFrame(loop); }
      function pause() { playing = false; cancelAnimationFrame(raf); CLOCK.pause(); scenes.forEach((s) => s.comp.media && s.comp.media.pause && s.comp.media.pause()); document.getElementById('btn-play').textContent = '▶ 连播 10 大句型'; }
      function jumpTo(i) { seek(scenes[i].start + 0.75); }

      document.getElementById('btn-play').addEventListener('click', () => playing ? pause() : play());
      document.getElementById('btn-replay').addEventListener('click', () => { seek(0); play(); });
      document.getElementById('scrubber').addEventListener('input', (e) => { pause(); seek(parseFloat(e.target.value)); });
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
        else if (e.key === 'h' || e.key === 'H') document.getElementById('hud').classList.toggle('hidden');
        else if (/^[0-9]$/.test(e.key)) { const k = e.key === '0' ? 9 : +e.key - 1; if (scenes[k]) jumpTo(k); }
      });

      window.__MH_ENGINE__ = { duration: DURATION, seek, play, pause, time: () => cur, isPlaying: () => playing, scenes: scenes.map((s) => ({ type: s.type, start: s.start, dur: s.dur })) };
      if (params.get('clean') === '1') document.getElementById('hud').classList.add('hidden');
      seek(params.has('t') ? parseFloat(params.get('t')) : 0);
    }
    boot();
  </script>
</body>
