<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Brutalism 撞色潮刊 · 组件展厅（风格包 06）</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../core/engine.css" />
  <style>
    :root {
      --nb-font-cn: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --nb-font-latin: 'Arial Black', 'Helvetica Neue', 'Arial', 'Noto Sans SC', sans-serif;
      --nb-font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      --nb-paper: #F6F1E3; --nb-ink: #111111;
      --nb-yellow: #FFE500; --nb-blue: #3B82F6; --nb-mint: #00E599; --nb-coral: #FF4D6D;
    }
    #viewport { background: var(--nb-paper); overflow: hidden; font-family: var(--nb-font-cn); color: var(--nb-ink); }
    #avatar-morph-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 32; pointer-events: none; }

    /* 暖米色动态呼吸波点底纹（屏幕固定层，按时间确定性呼吸漂移） */
    #nb-bg-layer {
      position: absolute; inset: -80px; z-index: 0; pointer-events: none; will-change: transform;
      background-color: var(--nb-paper);
      background-image: radial-gradient(rgba(17,17,17,0.17) 1.8px, transparent 1.8px);
      background-size: 28px 28px;
    }
    /* 3D 潮刊画布（透明，仅画 112px 粗网格作为空间参照） */
    #camera-viewport { position: absolute; inset: 0; z-index: 10; overflow: hidden; perspective: 1650px; pointer-events: none; background: transparent; }
    #nb-world {
      position: absolute; left: 0; top: 0; width: 11200px; height: 1300px; transform-style: preserve-3d; will-change: transform;
      background-image: linear-gradient(90deg, rgba(17,17,17,0.05) 1px, transparent 1px), linear-gradient(rgba(17,17,17,0.05) 1px, transparent 1px);
      background-size: 112px 112px;
    }

    /* 四色撞色色块横扫转场 */
    #nb-wipe { position: absolute; inset: 0; z-index: 15; pointer-events: none; display: none; overflow: hidden; }
    .nb-slab { position: absolute; top: -20px; left: -90px; width: 2200px; height: 1120px; border-left: 6px solid var(--nb-ink); box-shadow: -14px 0 0 var(--nb-ink); }
    .nb-slab .no { position: absolute; left: 110px; top: 300px; font-family: var(--nb-font-latin); font-size: 320px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; color: var(--nb-paper); -webkit-text-stroke: 8px var(--nb-ink); text-shadow: 16px 16px 0 var(--nb-ink); }
    .nb-slab .lb { position: absolute; left: 130px; top: 680px; padding: 10px 26px; background: var(--nb-ink); color: var(--nb-yellow); font-size: 64px; font-weight: 900; }

    #screen-layer { position: absolute; inset: 0; z-index: 26; pointer-events: none; }

    /* 顶部 7 段粗黑边标签（兼作进度） */
    #nb-tabs { position: absolute; left: 40px; top: 16px; z-index: 45; display: flex; gap: 8px; }
    .nb-tab { width: 118px; position: relative; padding: 7px 8px 12px; box-sizing: border-box; background: #FFFFFF; border: 3px solid var(--nb-ink); box-shadow: 3px 3px 0 var(--nb-ink); font-family: var(--nb-font-mono); font-size: 12px; font-weight: 900; color: var(--nb-ink); cursor: pointer; white-space: nowrap; }
    .nb-tab.done { background: var(--nb-mint); }
    .nb-tab.on { background: var(--nb-coral); color: #FFFFFF; transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--nb-ink); }
    .nb-tab .fl { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--nb-ink); }

    /* 稳态粗黑画框人像 + 剪影占位 */
    html:not([data-mh-pip="circle"]) #avatar-stage { border-radius: 0 !important; }
    #avatar-stage { border: 4px solid var(--nb-ink) !important; box-shadow: 12px 12px 0 var(--nb-ink) !important; }
    #avatar-stage.is-full { border: 0 solid transparent !important; box-shadow: none !important; }
    #avatar-silhouette { position: absolute; left: 50%; bottom: 0; height: 82%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
    #avatar-tag { background: var(--nb-yellow) !important; color: var(--nb-ink) !important; border: 3px solid var(--nb-ink) !important; box-shadow: 4px 4px 0 var(--nb-ink) !important; border-radius: 0 !important; font-family: var(--nb-font-mono) !important; font-weight: 900 !important; font-size: 14px !important; letter-spacing: 0.1em !important; padding: 7px 14px !important; transform: rotate(-3deg); }
    #avatar-tag i { display: inline-block; width: 10px; height: 10px; background: var(--nb-coral); border: 2px solid var(--nb-ink); margin-right: 10px; }

    /* 黑底黄影高对比字幕条 */
    #subtitle-bar {
      bottom: 36px !important; background: #111111 !important; border: 4px solid #111111 !important; border-radius: 0 !important;
      backdrop-filter: none !important; box-shadow: 7px 7px 0 #FFE500 !important;
      padding: 12px 32px 13px !important; color: #FFFFFF !important; font-family: var(--nb-font-cn) !important;
      font-size: 40px !important; font-weight: 900 !important; letter-spacing: 0.03em !important;
    }
    #subtitle-bar .w { color: #FFFFFF; text-shadow: none; }
    #subtitle-bar .w.passed { color: #FFFFFF !important; text-shadow: none !important; }
    #subtitle-bar .w.active { color: #FFE500 !important; text-shadow: none !important; }

    /* v3.4.1 · 全屏背景样片：meta.avatar.fullLook = "vignette"（A 暗角 + 外圈虚化）| "frame"（B 06 画框 + 轻暗角） */
    #avatar-stage .mh-look { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    #avatar-stage:not(.is-full) .mh-look { display: none; }
    /* v3.4.1 · fullFrame "inset"：画框模式下暗角跟着人像框的实际尺寸淡入淡出（不靠 is-full 开关），各形态统一 10px 硬投影，换形态不跳 */
    html[data-mh-full="frame"] #avatar-stage .mh-look { display: block; }
    html[data-mh-full="frame"] #avatar-stage { box-shadow: 10px 10px 0 var(--nb-ink) !important; }
    html[data-mh-full="vignette"] .mh-look-blur { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 29.17%, transparent 70.83%, #000 100%); mask-image: linear-gradient(90deg, #000 0%, transparent 29.17%, transparent 70.83%, #000 100%); }
    html[data-mh-full="vignette"] .mh-look-dark { background:
      linear-gradient(90deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 29.17%, rgba(0,0,0,0) 70.83%, rgba(0,0,0,.45) 100%),
      linear-gradient(180deg, rgba(0,0,0,.22) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 82%, rgba(0,0,0,.22) 100%); }
    html[data-mh-full="frame"] .mh-look-dark { background:
      linear-gradient(90deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 29.17%, rgba(0,0,0,0) 70.83%, rgba(0,0,0,.25) 100%),
      linear-gradient(180deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 82%, rgba(0,0,0,.12) 100%); }
    html[data-mh-layout="fill"] #avatar-tag { font-size: 32px !important; padding: 9px 18px !important; left: 18px !important; bottom: 16px !important; }
    html[data-mh-layout="fill"] #avatar-tag i { width: 16px; height: 16px; }
    html[data-mh-full="frame"] #avatar-stage.is-full { border: 4px solid var(--nb-ink) !important; box-shadow: 10px 10px 0 var(--nb-ink) !important; }

    #load-error { position: absolute; left: 80px; top: 200px; z-index: 99; padding: 16px 24px; background: var(--nb-coral); color: #fff; border: 4px solid var(--nb-ink); font-size: 28px; font-weight: 900; display: none; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="nb-bg-layer"></div>
    <div id="camera-viewport"><div id="nb-world"></div></div>
    <div id="nb-wipe">
      <div class="nb-slab" style="background:var(--nb-coral);"></div>
      <div class="nb-slab" style="background:var(--nb-mint);"></div>
      <div class="nb-slab" style="background:var(--nb-blue);"></div>
      <div class="nb-slab" style="background:var(--nb-yellow);"><div class="no">01</div><div class="lb">—</div></div>
    </div>
    <div id="screen-layer"></div>
    <div id="nb-tabs"></div>

    <div id="avatar-stage">
      <img id="avatar-studio-bg" src="assets/studio_bg.png" alt="studio" />
      <svg id="avatar-silhouette" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet">
        <circle cx="200" cy="150" r="92" fill="#111111" stroke="#FFE500" stroke-width="6" />
        <path d="M30 520 C40 340 110 270 200 270 C290 270 360 340 370 520 Z" fill="#111111" stroke="#FFE500" stroke-width="6" />
        <text x="200" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="900" fill="#FFE500" letter-spacing="3">AVATAR · 人像占位</text>
      </svg>
      <div id="avatar-tag"><i></i><span id="avatar-tag-tx">YOUR NAME</span></div>
    </div>

    <canvas id="avatar-morph-canvas" width="1920" height="1080"></canvas>
    <div id="subtitle-bar"></div>
    <div id="load-error"></div>
  </div>

  <div id="hud">
    <button id="btn-play" class="primary">▶ 连播 10 大句型</button>
    <button id="btn-replay">↺ 重播</button>
    <input id="scrubber" type="range" min="0" max="50" step="0.01" value="0" />
    <span id="time-readout">0.00 / 0.00s</span>
    <span class="hud-sep"></span>
    <span class="hud-label">H 隐藏控制栏 · 1–9 / 0 切换句型 · 空格播放</span>
  </div>

  <script src="../../core/vendor/gsap.min.js"></script>
  <script src="../../core/camera-rig.js"></script>
  <script src="../../core/avatar-morph-fx.js"></script>
  <script src="../../core/avatar.js"></script>
  <script src="../../core/subtitle.js"></script>
  <script src="../../core/script-sync.js"></script>
  <script src="../../core/talk.js"></script>
  <script src="../../core/focus.js"></script>
  <script src="components.js"></script>
  <script src="themes.js"></script>
  <script>
    const vp = document.getElementById('viewport');
    function fit() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      vp.style.transform = `scale(${s})`;
      vp.style.left = `${(window.innerWidth - 1920 * s) / 2}px`;
      vp.style.top = `${(window.innerHeight - 1080 * s) / 2}px`;
    }
    window.addEventListener('resize', fit); fit();

    const ZONE_GAP = 200, ZONE_Y = 100, SX = 650, SY = 470;
    // 组件局部安全区 x60–1340 / y100–980 → 屏幕 x≈115–1295（避开人像框 1328+）/ y≈100–910（避开字幕）
    const CAM_DX = 60, CAM_ZOOM = 0.92;
    const params = new URLSearchParams(location.search);

    /** 把每段 sub[] 均匀铺成 core/subtitle.js 需要的 WORD_DATA（中文逐字、英文/数字成词） */
    function buildWordData(scenes) {
      const words = [], lines = [];
      scenes.forEach((sc) => {
        if (MHEngine.ScriptSync.pushWords(sc, words, lines)) return; // 真实词级时间轴优先，否则均分
        const subs = sc.sub || []; if (!subs.length) return;
        const a0 = sc.start + 0.35, a1 = sc.start + sc.dur - 0.3, slot = (a1 - a0) / subs.length;
        subs.forEach((line, li) => {
          const toks = line.match(/[A-Za-z0-9.\-_/@#:+]+|\s+|./g) || [];
          const real = toks.filter((x) => !/^\s+$/.test(x));
          const s0 = a0 + li * slot, dt = (slot - 0.25) / Math.max(1, real.length);
          const a = words.length, sp = [];
          let k = 0;
          toks.forEach((tk) => {
            if (/^\s+$/.test(tk)) { if (words.length > a) sp.push(words.length - 1); return; }
            words.push([tk, +(s0 + k * dt).toFixed(3), +(s0 + (k + 1) * dt).toFixed(3)]); k++;
          });
          if (words.length > a) lines.push({ a, b: words.length - 1, sp });
        });
      });
      return { words, lines };
    }

    async function boot() {
      let script;
      try {
        const src = params.get('data') || 'demo_data.json';
        script = await (await fetch(src, { cache: 'no-store' })).json();
        MHEngine.ScriptSync.resolveMedia(script, src); // v3.4：媒体路径以剧本文件为基准
      } catch (e) {
        const el = document.getElementById('load-error');
        el.style.display = 'block'; el.textContent = '剧本 JSON 加载失败：请用 python core/tools/serve.py 通过 HTTP 打开本页。';
        throw e;
      }
      const theme = script.theme || {};
      const root = document.documentElement.style;
      ['paper', 'ink', 'yellow', 'blue', 'mint', 'coral'].forEach((k) => { if (theme[k]) root.setProperty(`--nb-${k}`, theme[k]); });
      NeoBrutalism.injectCSS();
      // 实时换肤：URL ?theme= ＞ 剧本 theme.preset ＞ zine（默认 zine 不注入任何覆盖，与原画面逐像素一致）
      if (window.NeoBrutalismThemes) NeoBrutalismThemes.init(script);

      // 人像：可选真人视频，否则用剪影占位
      const meta = script.meta || {}, av = meta.avatar || {};
      if (av.bg) document.getElementById('avatar-studio-bg').src = av.bg;
      // v3.4.1：名牌没填就整块不出（不再显示占位英文 YOUR NAME）
      document.getElementById('avatar-tag-tx').textContent = av.tag || '';
      if (!String(av.tag || '').trim()) document.getElementById('avatar-tag').style.display = 'none';
      // v3.4.1 全屏背景样片（只在剧本写了才生效）
      // meta.avatar.fullFrame = "inset"（全片全屏都缩进 06 画框）与样片字段 fullLook = "frame" 同一套
      const LOOK = av.fullFrame === 'inset' ? 'frame' : (av.fullLook === 'vignette' || av.fullLook === 'frame' ? av.fullLook : '');
      if (LOOK) {
        document.documentElement.setAttribute('data-mh-full', LOOK);
        const stg = document.getElementById('avatar-stage');
        ['mh-look mh-look-blur', 'mh-look mh-look-dark'].forEach((c) => { const d = document.createElement('div'); d.className = c; stg.insertBefore(d, document.getElementById('avatar-tag')); });
      }
      if (av.video) {
        const v = document.createElement('video');
        v.id = 'avatar-video'; v.src = av.video; v.muted = true; v.playsInline = true; v.preload = 'auto';
        document.getElementById('avatar-stage').insertBefore(v, document.getElementById('avatar-tag'));
        document.getElementById('avatar-silhouette').style.display = 'none';
      }

      // 组装场景
      // v3.4.1 铺满版式：meta.layout = "fill" → 人像侧栏卡 520×700（右边距 60、上下居中）/ 圆窗直径 260（右、下边距 60），
      //   组件区 = 屏幕 x 80→1260（侧栏卡）或 80→1500（圆窗），y 150→930，换算成组件局部坐标放进 ctx.area（不写 = 原版式，逐帧不变）
      // v3.4.1：meta.cardDetail = "trim" → 卡片细节润色（内沿细线 / L 角标 / 聚光同色柔光 / 进度条边缘；不写 = 原样）
      if (meta.cardDetail === 'trim') document.documentElement.setAttribute('data-mh-card', 'trim');
      const FILL = meta.layout === 'fill';
      if (FILL) document.documentElement.setAttribute('data-mh-layout', 'fill');
      const AREA_X = { card: [80, 1260], pip: [80, 1500], corner: [80, 1360] };
      const areaFor = (sc) => {
        if (!FILL) return null;
        const modes = [sc.avatar || 'card', ...((sc.avatarCues || []).map((c) => c && c[1]))].filter((m) => m && m !== 'full');
        const m = modes[modes.length - 1];
        if (!AREA_X[m]) return null;
        const lx = (sx) => 700 - CAM_DX + (sx - SX) / CAM_ZOOM, ly = (sy) => 500 + (sy - SY) / CAM_ZOOM;
        return { x0: lx(AREA_X[m][0]), x1: lx(AREA_X[m][1]), y0: ly(150), y1: ly(930), k: 1 / CAM_ZOOM, mode: m };
      };
      const world = document.getElementById('nb-world');
      // v3.4.1：每段被下一次色块横扫盖住的局部秒（与下面 WIPE 同一公式）→ ctx.coverAt，屏幕层牌子必须在它之前退完（牌子在色块上层）
      const coverAtOf = (() => {
        const SS = script.scenes || [], out = [];
        let a0 = 0;
        const wd = (s) => (Array.isArray(s.words) ? s.words : []).filter((w) => Array.isArray(w) && w.length >= 3);
        SS.forEach((sc, i) => {
          const du = sc.dur || 6, nx = SS[i + 1], b = a0 + du;
          let c = null;
          if (nx) {
            const tk = (nx.transition === 'cut' || nx.transition === 'wipe') ? nx.transition : (meta.transition === 'cut' ? (nx.chapter ? 'wipe' : 'cut') : 'wipe');
            if (tk === 'wipe') {
              const pw = wd(sc), nw = wd(nx);
              let LD = 0.36;
              if (pw.length && nw.length) {
                const pe = Math.max(...pw.map((w) => +w[2])), hold = sc.hold != null && Number.isFinite(+sc.hold) ? +sc.hold : 0.25, minLd = sc.hold != null ? 0.1 : 0.16;
                LD = Math.max(minLd, Math.min(0.36, b - (pe + hold)));
              }
              c = du - LD;
            }
          }
          out.push(c); a0 = b;
        });
        return out;
      })();
      const scenes = []; let acc = 0, zoneX = 0;
      (script.scenes || []).forEach((sc, i) => {
        const factory = NeoBrutalism.COMPONENTS[sc.type] || MHEngine.ScriptSync.coreComponent(sc.type);
        if (!factory) { console.warn('unknown scene type', sc.type); return; }
        const dur = sc.dur || 6;
        const ctx = MHEngine.ScriptSync.sceneCtx(sc, acc, dur);
        ctx.area = areaFor(sc);
        ctx.coverAt = coverAtOf[i];
        const comp = factory.create(sc.data || {}, ctx);
        // v3.4.1 牌子层：图表句型的 data.badges（关键词牌 / 多色大字 / 印章 / 贴纸 / 标签）叠在屏幕层，分句念完就退场
        let badges = null;
        if (!comp.handlesBadges && MHEngine.Badges && sc.data && Array.isArray(sc.data.badges) && sc.data.badges.length) {
          badges = MHEngine.Badges.create(sc.data.badges, ctx);
          badges.el.style.display = 'none'; document.getElementById('screen-layer').appendChild(badges.el);
        }
        const zx = zoneX, zy = ZONE_Y; zoneX += (comp.w || 1400) + ZONE_GAP;
        if (comp.layer === 'screen') { comp.el.style.display = 'none'; document.getElementById('screen-layer').appendChild(comp.el); }
        else { comp.el.style.left = `${zx}px`; comp.el.style.top = `${zy}px`; world.appendChild(comp.el); }
        scenes.push({ ...sc, idx: i, start: acc, dur, comp, badges, zx, zy, avatar: sc.avatar || comp.avatar });
        acc += dur;
      });
      const DURATION = acc;
      world.style.width = `${zoneX + 1400}px`;
      document.getElementById('scrubber').max = DURATION;

      // 运镜关键帧：每段局部机位 → 世界坐标；段与段之间在色块遮挡下硬切
      const kfs = [];
      scenes.forEach((s, i) => {
        const cams = s.comp.cams && s.comp.cams.length ? s.comp.cams : [{ t: 0, x: 700, y: 500, zoom: 1 }];
        cams.forEach((c, j) => {
          let t = s.start + Math.min(c.t, s.dur);
          if (j === cams.length - 1 && i < scenes.length - 1) t = s.start + s.dur - 0.002;
          kfs.push({ t, x: s.zx + c.x - CAM_DX, y: s.zy + c.y, zoom: (c.zoom || 1) * CAM_ZOOM, rx: c.rx || 0, ry: c.ry || 0, rz: c.rz || 0, screenX: SX, screenY: SY });
        });
      });
      const camRig = new MHEngine.CameraRig3D(world, { viewW: 1920, viewH: 1080, handheld: 0.6 });
      camRig.setKeyframes(kfs);

      // 人像形态：card / pip / corner / full（4 种形态全部支持 core 点阵粒子散聚转场！）
      const avatar = new MHEngine.AvatarController(Object.assign({
        card:   { left: 1328, top: 82,  width: 540, height: 790, borderRadius: 0,   borderWidth: 4, tagOpacity: 1 },
        pip:    { left: 1532, top: 642, width: 320, height: 320, borderRadius: 160, borderWidth: 4, tagOpacity: 0 },
        corner: { left: 1410, top: 530, width: 458, height: 342, borderRadius: 0,   borderWidth: 4, tagOpacity: 1 }
      }, FILL ? {
        card:   { left: 1340, top: 190, width: 520, height: 700, borderRadius: 0,   borderWidth: 4, tagOpacity: 1 },
        pip:    { left: 1600, top: 760, width: 260, height: 260, borderRadius: 130, borderWidth: 4, tagOpacity: 0 }
      } : {}, LOOK === 'frame' ? {
        fullscreen: { left: 48, top: 48, width: 1824, height: 984, borderRadius: 0, borderWidth: 4, tagOpacity: 0 }
      } : {}));
      const mapAv = (m) => m === 'full' ? 'fullscreen' : (m === 'pip' || m === 'corner' ? m : 'card');
      // v3.4.1：meta.avatar.morph = 换形态粒子转场时长（秒，默认 0.5 = 原样）；其余时刻点按比例缩放
      const MD = Number.isFinite(+av.morph) && +av.morph > 0.1 ? +av.morph : 0.5, MK = MD / 0.5;
      // v3.4.1：meta.avatar.morphStyle = "snap" → 利落版散聚（人像网点缩散 / 长回、粒子先快后慢；不写 = 原样逐帧不变）
      const SNAP = av.morphStyle === 'snap', SWAP = SNAP ? MD * MHEngine.AvatarMorphFX.SNAP_SWAP : 0;
      const avatarMorph = new MHEngine.AvatarMorphFX(document.getElementById('avatar-morph-canvas'), avatar.presets);
      const tl = gsap.timeline({ paused: true });
      const AVSEG = MHEngine.ScriptSync.avatarSegments(scenes); // 无 avatarCues 时与 scenes 一一对应
      // v3.4 转场（U3 待定，两种都可选）：meta.transition = "wipe"（默认：四色色块横扫 + 人像粒子散聚）| "cut"（换段直接切，
      //       只有标了 "chapter": true 的段保留色块）；单段 "transition": "wipe" | "cut" 可覆盖。不写 = 原样（逐帧不变）
      const TRANS = meta.transition === 'cut' ? 'cut' : 'wipe';
      const CHROME_OFF = document.documentElement.classList.contains('mh-chrome-off');
      const kindAt = (sc) => (sc.transition === 'cut' || sc.transition === 'wipe') ? sc.transition : (TRANS === 'cut' && sc.chapter ? 'wipe' : TRANS);
      avatar.setImmediate(scenes[0] ? mapAv(scenes[0].avatar) : 'card');
      AVSEG.forEach((s, i) => {
        if (i === 0) return;
        const prev = mapAv(AVSEG[i - 1].avatar);
        const cur = mapAv(s.avatar);
        s.cut = (s.scene !== AVSEG[i - 1].scene ? kindAt(s.scene) : TRANS) === 'cut';
        if (prev !== cur) {
          if (s.cut) { avatar.animateOnTimeline(tl, cur, s.start, 0.001); return; }   // 硬切：人像在段首这一帧直接换形态
          if (SNAP) {   // 利落版：从 cue 那一刻起散；人像全散开的中点一次性换形态（看不见时换，不出现拉伸中的框）
            avatarMorph.addMorph({ time: s.start, duration: MD, fromMode: prev, toMode: cur, count: 1000, seed: 60600 + i, snap: true });
            avatar.animateOnTimeline(tl, cur, s.start + SWAP, 0.001, 0.001);
            return;
          }
          avatarMorph.addMorph({ time: s.start + 0.02 * MK, duration: MD, fromMode: prev, toMode: cur, count: 1000, seed: 60600 + i });
          avatar.animateOnTimeline(tl, cur, s.start + 0.06 * MK, 0.48 * MK);
        }
      });
      tl.to({}, { duration: 0.05 }, DURATION);

      // 字幕
      const WORD_DATA = buildWordData(scenes);
      window.WORD_DATA = WORD_DATA;
      const subtitle = new MHEngine.SubtitleRenderer(document.getElementById('subtitle-bar'), WORD_DATA);

      // 顶部句型标签
      const tabsEl = document.getElementById('nb-tabs');
      scenes.forEach((s, i) => {
        const tb = document.createElement('div'); tb.className = 'nb-tab';
        tb.innerHTML = `${String(i + 1).padStart(2, '0')} ${s.type.toUpperCase()}<div class="fl"></div>`;
        tb.addEventListener('click', () => jumpTo(i));
        tabsEl.appendChild(tb); s.tab = tb;
      });

      const wipe = document.getElementById('nb-wipe');
      const slabs = Array.from(wipe.querySelectorAll('.nb-slab'));
      const bg = document.getElementById('nb-bg-layer');
      const stageEl = document.getElementById('avatar-stage');
      const camViewport = document.getElementById('camera-viewport');
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const easeOut = (x) => 1 - Math.pow(1 - x, 3), easeIn = (x) => x * x * x;

      // v3.4.1：有词级时间时，色块横扫让开口播 —— 盖上不早于上一句最后一个字念完 0.25s，掀开不晚于下一句第一个字；
      //         没有 words 时与原来逐帧一致（盖 0.36s / 掀 0.44s）
      const wordsOf = (s) => (Array.isArray(s.words) ? s.words : []).filter((w) => Array.isArray(w) && w.length >= 3);
      const WIPE = scenes.map((s, i) => {
        if (!i) return null;
        const pw = wordsOf(scenes[i - 1]), nw = wordsOf(s);
        if (!pw.length || !nw.length) return [0.36, 0.44];
        const pe = Math.max(...pw.map((w) => +w[2])), ns = Math.min(...nw.map((w) => +w[1]));
        // 上一段写了 hold（秒）：它的内容要在最后一个字后完整挂满 hold 秒 → 色块可以盖得更快（最短 0.1s）
        const prev = scenes[i - 1], hold = Number.isFinite(+prev.hold) && prev.hold != null ? +prev.hold : 0.25, minLd = prev.hold != null ? 0.1 : 0.16;
        return [Math.max(minLd, Math.min(0.36, s.start - (pe + hold))), Math.max(0.2, Math.min(0.44, ns - s.start))];
      });

      function updateUI(t) {
        MHEngine.ScriptSync.renderCues(script, t);
        tl.time(Math.min(t, DURATION));
        camRig.render(t);
        subtitle.render(t);
        // 波点呼吸：缩放 + 缓慢漂移（纯 transform，确定性）
        const br = 1 + 0.035 * Math.sin(t * 1.3), dx = 22 * Math.sin(t * 0.21), dy = 16 * Math.cos(t * 0.17);
        bg.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${br.toFixed(4)})`;
        bg.style.opacity = (0.86 + 0.14 * Math.sin(t * 1.3 + 1)).toFixed(3);

        let cur = scenes.length - 1;
        scenes.forEach((s, i) => { if (t >= s.start && t < s.start + s.dur) cur = i; });
        scenes.forEach((s, i) => {
          if (Math.abs(i - cur) <= 1) s.comp.update(t - s.start);
          if (s.comp.layer === 'screen') s.comp.el.style.display = i === cur ? 'block' : 'none';
          if (s.badges) { s.badges.el.style.display = i === cur ? 'block' : 'none'; if (i === cur) s.badges.update(t - s.start); }
          s.tab.classList.toggle('on', i === cur);
          s.tab.classList.toggle('done', i < cur);
          s.tab.querySelector('.fl').style.width = `${(clamp01((t - s.start) / s.dur) * 100).toFixed(1)}%`;
        });
        const S = scenes[cur];
        const AS = MHEngine.ScriptSync.avatarAt(AVSEG, t, S);
        const isFull = AS.avatar === 'full';
        stageEl.classList.toggle('is-full', isFull && t >= AS.start + (AS.cut ? 0 : (SNAP ? SWAP : 0.2 * MK)));
        camViewport.style.opacity = isFull && t >= AS.start + (AS.cut ? 0 : (SNAP ? SWAP : 0.15 * MK)) && t < AS.start + AS.dur ? '0' : '1';
        if (LOOK === 'frame') {   // 暗角按人像框当前宽度渐变：全屏（1824）满、侧栏卡 / 圆窗（≤520）无
          const sw = parseFloat(stageEl.style.width) || 0, va = Math.max(0, Math.min(1, (sw - 600) / (1824 - 600)));
          stageEl.querySelectorAll('.mh-look').forEach((e) => { e.style.opacity = va.toFixed(3); });
        }

        // 四色色块横扫：依次盖上（黄色在最上层带段号）→ 反序抽离
        let shown = false;
        for (let i = 1; i < scenes.length; i++) {
          const b = scenes[i].start;
          if (kindAt(scenes[i]) === 'cut') continue;
          const [LD, TL] = WIPE[i], sa = LD / 0.36, sb = TL / 0.44;
          if (t >= b - LD && t < b + TL) {
            slabs.forEach((sl, k) => {
              let x;
              if (t < b) x = 1960 * (1 - easeOut(clamp01((t - (b - LD) - k * 0.04 * sa) / (0.2 * sa))));
              else x = -2100 * easeIn(clamp01((t - b - (3 - k) * 0.05 * sb) / (0.26 * sb)));
              sl.style.transform = `translateX(${x.toFixed(1)}px) skewX(-6deg)`;
            });
            const noEl = slabs[3].querySelector('.no');
            noEl.textContent = String(i + 1).padStart(2, '0');
            noEl.style.display = CHROME_OFF && !scenes[i].label ? 'none' : '';   // 导出时没写 label 的段不出段号
            // v3.4：导出 / 抽帧（?chrome=0）时没写 label 就不显示英文句型名（预览页照旧显示，便于对照）
            const lbTx = scenes[i].label || (CHROME_OFF ? '' : scenes[i].type), lbEl = slabs[3].querySelector('.lb');
            lbEl.textContent = lbTx; lbEl.style.display = lbTx ? '' : 'none';
            wipe.style.display = 'block'; shown = true; break;
          }
        }
        if (!shown) wipe.style.display = 'none';

        stageEl.style.opacity = avatarMorph.render(t).toFixed(3);
        if (SNAP) MHEngine.AvatarMorphFX.applyHalftone(stageEl, avatarMorph.halftone);
        document.getElementById('scrubber').value = t.toFixed(2);
        document.getElementById('time-readout').textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)}s · ${String(cur + 1).padStart(2, '0')} ${S.type}`;
      }

      // 播放时钟（无音轨，按 performance.now 推进；有 avatar.video 时同步视频）
      let playing = false, t0 = 0, tStart = 0, cur = 0, raf = null;
      const vid = document.getElementById('avatar-video');
      const CLOCK = MHEngine.ScriptSync.mediaClock({ meta, duration: DURATION, video: vid, scenes }); // meta.avatar.offset + meta.audio
      function seek(t) {
        cur = Math.max(0, Math.min(DURATION, t)); updateUI(cur);
        scenes.forEach((s) => { const m = s.comp.media; if (m && m.tagName === 'VIDEO') { try { m.currentTime = Math.max(0, cur - s.start - 0.3) % (m.duration || 1e9); } catch (_) {} } });
        CLOCK.seek(cur);
        if (playing) { t0 = performance.now(); tStart = cur; }
      }
      function loop() {
        if (!playing) return;
        const t = CLOCK.now(tStart + (performance.now() - t0) / 1000); CLOCK.follow(t);
        if (t >= DURATION) { pause(); seek(DURATION); return; }
        cur = t; updateUI(t); raf = requestAnimationFrame(loop);
      }
      function play() { if (cur >= DURATION - 0.05) cur = 0; playing = true; t0 = performance.now(); tStart = cur; CLOCK.play(cur); scenes.forEach((s) => s.comp.media && s.comp.media.play && s.comp.media.play().catch(() => {})); document.getElementById('btn-play').textContent = '⏸ 暂停'; raf = requestAnimationFrame(loop); }
      function pause() { playing = false; cancelAnimationFrame(raf); CLOCK.pause(); scenes.forEach((s) => s.comp.media && s.comp.media.pause && s.comp.media.pause()); document.getElementById('btn-play').textContent = '▶ 连播 10 大句型'; }
      function jumpTo(i) { seek(scenes[i].start + 0.45); }

      document.getElementById('btn-play').addEventListener('click', () => playing ? pause() : play());
      document.getElementById('btn-replay').addEventListener('click', () => { seek(0); play(); });
      document.getElementById('scrubber').addEventListener('input', (e) => { pause(); seek(parseFloat(e.target.value)); });
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
        else if (e.key === 'h' || e.key === 'H') document.getElementById('hud').classList.toggle('hidden');
        else if (/^[0-9]$/.test(e.key)) { const k = e.key === '0' ? 9 : +e.key - 1; if (scenes[k]) jumpTo(k); }
      });

      window.__MH_ENGINE__ = { duration: DURATION, seek, play, pause, time: () => cur, isPlaying: () => playing, scenes: scenes.map((s) => ({ type: s.type, start: s.start, dur: s.dur })) };
      if (params.get('clean') === '1') document.getElementById('hud').classList.add('hidden');
      seek(params.has('t') ? parseFloat(params.get('t')) : 0);
    }
    boot();
  </script>
</body>
</html>
