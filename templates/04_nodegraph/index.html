<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node Graph 3D 节点工作流 · 组件展厅（风格包 04）</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../core/engine.css" />
  <style>
    :root {
      --ng-font-cn: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --ng-font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      --ng-bg: #0A0D14; --ng-node: #121722; --ng-text: #F1F5F9;
      --ng-cyan: #38BDF8; --ng-violet: #A78BFA; --ng-jade: #00E5C3; --ng-amber: #FFB84D; --ng-coral: #FF4D6D;
    }
    #viewport { background: var(--ng-bg); overflow: hidden; font-family: var(--ng-font-cn); color: var(--ng-text); }
    #avatar-morph-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 32; pointer-events: none; }

    /* 屏幕固定暗蓝图点阵底纹（缓慢视差漂移）+ 暗角 */
    #ng-bg-layer {
      position: absolute; inset: -60px; z-index: 0; pointer-events: none; will-change: transform;
      background-color: var(--ng-bg);
      background-image: radial-gradient(rgba(148, 163, 184, 0.16) 1.4px, transparent 1.4px);
      background-size: 30px 30px;
    }
    #ng-vignette { position: absolute; inset: 0; z-index: 11; pointer-events: none; background: radial-gradient(ellipse at 40% 45%, transparent 55%, rgba(4, 6, 10, 0.55) 100%); }
    /* 3D 蓝图画布：150px 青色大网格 + 30px 点阵 */
    #camera-viewport { position: absolute; inset: 0; z-index: 10; overflow: hidden; perspective: 1700px; pointer-events: none; background: transparent; }
    #ng-world {
      position: absolute; left: 0; top: 0; width: 11200px; height: 1300px; transform-style: preserve-3d; will-change: transform;
      background-image:
        radial-gradient(rgba(148, 163, 184, 0.20) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.055) 1px, transparent 1px),
        linear-gradient(rgba(56, 189, 248, 0.055) 1px, transparent 1px);
      background-size: 30px 30px, 150px 150px, 150px 150px;
    }

    /* 转场：四色霓虹电缆帘幕横扫（暗色面板 + 发光前沿），最上层带 EXECUTE 节点卡 */
    #ng-wipe { position: absolute; inset: 0; z-index: 15; pointer-events: none; display: none; overflow: hidden; }
    .ng-slab { position: absolute; top: -20px; left: -40px; width: 2200px; height: 1120px; border-left: 6px solid var(--c); box-shadow: -10px 0 40px var(--c), inset 14px 0 30px -14px var(--c); }
    .ng-slab.top { background-color: #0B0F18; background-image: radial-gradient(rgba(148, 163, 184, 0.14) 1.4px, transparent 1.4px); background-size: 30px 30px; }
    .ng-exec { position: absolute; left: 640px; top: 330px; width: 560px; border: 1.5px solid var(--ng-jade); border-radius: 3px; background: #121722; box-shadow: 0 30px 70px rgba(0,0,0,.7), 0 0 40px rgba(0,229,195,.25); overflow: hidden; }
    .ng-exec .nh { height: 42px; padding: 0 16px; display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, color-mix(in srgb, var(--ng-jade) 30%, #121722), #121722 85%); border-bottom: 1px solid rgba(255,255,255,.1); font-family: var(--ng-font-mono); font-size: 15px; font-weight: 900; letter-spacing: .1em; color: #fff; }
    .ng-exec .nh i { margin-left: auto; width: 11px; height: 11px; border-radius: 50%; background: var(--ng-jade); box-shadow: 0 0 10px var(--ng-jade); }
    .ng-exec .no { padding: 18px 26px 0; font-family: var(--ng-font-mono); font-size: 190px; font-weight: 900; line-height: 1; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 3px var(--ng-cyan); text-shadow: 0 0 40px rgba(56,189,248,.45); }
    .ng-exec .lb { padding: 8px 26px 0; font-size: 52px; font-weight: 900; color: #fff; }
    .ng-exec .tr { margin: 18px 26px 26px; height: 12px; background: #06080D; border: 1px solid rgba(255,255,255,.1); position: relative; }
    .ng-exec .tr b { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--ng-jade); box-shadow: 0 0 12px var(--ng-jade); transform-origin: left center; }

    #screen-layer { position: absolute; inset: 0; z-index: 26; pointer-events: none; }

    /* 顶部 QUEUE 队列进度条（10 段） */
    #ng-tabs { position: absolute; left: 40px; top: 16px; z-index: 45; display: flex; gap: 4px; padding: 6px 8px; background: rgba(12, 16, 24, 0.94); border: 1px solid rgba(255,255,255,.12); border-radius: 3px; }
    .ng-tab { width: 116px; position: relative; padding: 3px 6px 11px; box-sizing: border-box; font-family: var(--ng-font-mono); font-size: 12px; font-weight: 900; color: #475569; letter-spacing: .04em; cursor: pointer; white-space: nowrap; }
    .ng-tab i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #1E293B; margin-right: 6px; vertical-align: 1px; }
    .ng-tab.done { color: #94A3B8; } .ng-tab.done i { background: var(--ng-jade); }
    .ng-tab.on { color: #F1F5F9; } .ng-tab.on i { background: var(--ng-cyan); box-shadow: 0 0 8px var(--ng-cyan); }
    .ng-tab .tr { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 4px; background: rgba(148,163,184,.16); }
    .ng-tab .fl { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ng-jade); box-shadow: 0 0 8px var(--ng-jade); }

    /* 人像：CAM_MONITOR 节点监视器框 + 剪影占位 */
    html:not([data-mh-pip="circle"]) #avatar-stage:not(.is-full) { border-radius: 3px !important; }
    #avatar-stage { border: 1.5px solid rgba(56, 189, 248, 0.55) !important; box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65), 0 0 30px rgba(56, 189, 248, 0.16) !important; }
    #avatar-stage.is-full { border-radius: 0 !important; border: 0 solid transparent !important; box-shadow: none !important; }
    #avatar-nh { position: absolute; left: 0; right: 0; top: 0; height: 36px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: linear-gradient(90deg, rgba(56,189,248,.32), rgba(18,23,34,.92) 80%); border-bottom: 1px solid rgba(255,255,255,.12); font-family: var(--ng-font-mono); font-size: 13px; font-weight: 900; color: #fff; letter-spacing: .1em; white-space: nowrap; }
    #avatar-nh b { margin-left: auto; color: var(--ng-coral); }
    #avatar-nh i { width: 9px; height: 9px; border-radius: 50%; background: var(--ng-coral); box-shadow: 0 0 8px var(--ng-coral); }
    #avatar-stage.is-full #avatar-nh, #avatar-stage.is-pip #avatar-nh { display: none; }
    #avatar-stage.is-corner #avatar-silhouette text, #avatar-stage.is-pip #avatar-silhouette text { display: none; }
    #avatar-silhouette { position: absolute; left: 50%; bottom: 0; height: 80%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
    #avatar-tag { background: rgba(12, 18, 28, 0.94) !important; color: #7DD3FC !important; border: 1px solid rgba(56, 189, 248, 0.5) !important; border-radius: 2px !important; font-family: var(--ng-font-mono) !important; font-weight: 900 !important; font-size: 13px !important; letter-spacing: 0.1em !important; padding: 7px 14px !important; }
    #avatar-tag i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ng-jade); box-shadow: 0 0 8px var(--ng-jade); margin-right: 10px; }

    /* 暗黑青边高对比字幕条 */
    #subtitle-bar {
      bottom: 38px !important; background: rgba(9, 12, 19, 0.96) !important; border: 1.5px solid rgba(56, 189, 248, 0.38) !important;
      border-left: 6px solid #00E5C3 !important; border-radius: 2px !important; backdrop-filter: none !important;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.55), 0 0 24px rgba(56, 189, 248, 0.12) !important;
      padding: 12px 34px 13px 30px !important; color: #F1F5F9 !important; font-family: var(--ng-font-cn) !important;
      font-size: 40px !important; font-weight: 900 !important; letter-spacing: 0.03em !important;
    }
    #subtitle-bar .w { color: #F1F5F9; text-shadow: none; }
    #subtitle-bar .w.passed { color: #F1F5F9 !important; text-shadow: none !important; }
    #subtitle-bar .w.active { color: #00E5C3 !important; text-shadow: 0 0 14px rgba(0, 229, 195, 0.45) !important; }

    #load-error { position: absolute; left: 80px; top: 200px; z-index: 99; padding: 16px 24px; background: #121722; color: #FF4D6D; border: 1.5px solid #FF4D6D; font-size: 28px; font-weight: 900; display: none; }
    html.mh-chrome-off #avatar-silhouette text { display: none; }   /* v3.5：导出时剪影占位不出英文 */

    /* v3.5 · 跟词组件（core/cue-kit.js）的 04 造型：暗色直角节点卡（3px 圆角上限）+ 1.5px 发光描边 + 青 / 紫 / 翡翠 / 琥珀信号色 + 等宽数字；不歪（只在剧本写了新字段时出现） */
    :root {
      --ng-on-acc: #06080D;
      --mk-ink: var(--ng-text); --mk-paper: var(--ng-bg); --mk-panel: color-mix(in srgb, var(--ng-bg) 70%, #000); --mk-muted: color-mix(in srgb, var(--ng-coral) 7%, var(--ng-node)); --mk-muted-ink: #8391A7;
      --mk-c1: color-mix(in srgb, var(--ng-cyan) 16%, var(--ng-node)); --mk-on1: var(--ng-text);
      --mk-c2: color-mix(in srgb, var(--ng-violet) 16%, var(--ng-node)); --mk-on2: var(--ng-text);
      --mk-c3: color-mix(in srgb, var(--ng-jade) 15%, var(--ng-node)); --mk-on3: var(--ng-text);
      --mk-c4: color-mix(in srgb, var(--ng-amber) 15%, var(--ng-node)); --mk-on4: var(--ng-text);
      --mk-accent: var(--ng-jade); --mk-dark: color-mix(in srgb, var(--ng-bg) 60%, #000); --mk-on-dark: var(--ng-jade);
      --mk-bw: 1.5px; --mk-rad: 3px; --mk-tilt: 0;
      --mk-sh: 0 22px 50px rgba(0,0,0,.6); --mk-sh-lg: 0 26px 60px rgba(0,0,0,.66); --mk-sh-sm: 0 10px 26px rgba(0,0,0,.55);
      --mk-font: var(--ng-font-cn); --mk-font-num: var(--ng-font-mono);
      --mk-board: color-mix(in srgb, var(--ng-node) 55%, var(--ng-bg)); --mk-board-tex: radial-gradient(rgba(148,163,184,.2) 1.5px, transparent 1.5px); --mk-tape: color-mix(in srgb, var(--ng-jade) 22%, var(--ng-node));
      --mk-trim: rgba(148,163,184,.18); --mk-trim-c: color-mix(in srgb, var(--ng-cyan) 70%, transparent);
      /* 全屏画框：CAM 监视器节点——1.5px 青色发光描边 + 深投影 + 外发光；框外 48px 露出蓝图点阵 */
      --mh-frame-bw: 1.5px; --mh-frame-color: color-mix(in srgb, var(--ng-cyan) 70%, transparent); --mh-frame-radius: 3; --mh-frame-vig: .3;
      --mh-frame-shadow: 0 30px 70px rgba(0,0,0,.7), 0 0 44px color-mix(in srgb, var(--ng-cyan) 26%, transparent);
    }
    html[data-ng-theme="daylight"] { --ng-on-acc: #FFFFFF; --mk-muted-ink: #64748B; --mk-sh: 0 18px 40px rgba(15,23,42,.14); --mk-sh-lg: 0 22px 48px rgba(15,23,42,.16); --mk-sh-sm: 0 8px 20px rgba(15,23,42,.12); --mk-board-tex: radial-gradient(rgba(71,85,105,.2) 1.5px, transparent 1.5px); }
    html[data-mh-full="frame"] #avatar-stage.is-full { border-radius: 3px !important; }
    /* 卡片信号色：按组件写进 style 的 --mk-cN 认出这是哪一路（青 / 紫 / 翡翠 / 琥珀） */
    .mk-zone [style*="var(--mk-c1)"] { --ng-a: var(--ng-cyan); }
    .mk-zone [style*="var(--mk-c2)"] { --ng-a: var(--ng-violet); }
    .mk-zone [style*="var(--mk-c3)"], .mk-zone .mk-cmp.right, .mk-zone .mk-ai { --ng-a: var(--ng-jade); }
    .mk-zone [style*="var(--mk-c4)"] { --ng-a: var(--ng-amber); }
    .mk-zone .mk-cmp.wrong { --ng-a: var(--ng-coral); }
    .mk-zone .mk-cstat { --ng-a: var(--ng-cyan); }
    .mk-zone .mk-box { border-color: color-mix(in srgb, var(--ng-a, var(--ng-text)) 75%, transparent); box-shadow: var(--mk-sh), 0 0 30px color-mix(in srgb, var(--ng-a, transparent) 24%, transparent); }
    .mk-zone .mk-box.lg { box-shadow: var(--mk-sh-lg), 0 0 34px color-mix(in srgb, var(--ng-a, transparent) 26%, transparent); }
    .mk-zone .mk-ticket, .mk-zone .mk-file, .mk-zone .mk-plate, .mk-zone .mk-cmp { background-image: linear-gradient(180deg, color-mix(in srgb, var(--ng-a, var(--ng-cyan)) 22%, transparent) 0, transparent 120px); }
    .mk-zone .mh-focus-ring { inset: -12px; border: 2px solid var(--ng-a, var(--ng-jade)); border-radius: 6px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ng-a, var(--ng-jade)) 30%, transparent), 0 0 34px color-mix(in srgb, var(--ng-a, var(--ng-jade)) 55%, transparent); }
    html[data-mh-card="trim"] .mk-zone .mh-focus-ring:not(.row) { box-shadow: 0 0 0 1px color-mix(in srgb, var(--ng-a, var(--ng-jade)) 30%, transparent), 0 0 40px 6px color-mix(in srgb, var(--ng-a, var(--ng-jade)) 50%, transparent); }
    .mk-head { color: var(--ng-text); text-shadow: 0 4px 24px rgba(0,0,0,.6); }
    .mk-ticket .no { background: var(--ng-a, var(--ng-cyan)); color: var(--ng-on-acc); border-radius: 3px 0 3px 0; box-shadow: 0 0 16px color-mix(in srgb, var(--ng-a, var(--ng-cyan)) 50%, transparent); }
    .mk-ticket .ico { color: var(--ng-a, var(--ng-cyan)); }
    .mk-ticket .pgb { background: color-mix(in srgb, var(--ng-bg) 70%, #000); border: 1px solid color-mix(in srgb, var(--ng-text) 14%, transparent); border-radius: 0; }
    .mk-ticket .pgb i { background: var(--ng-a, var(--ng-jade)); box-shadow: 0 0 14px var(--ng-a, var(--ng-jade)); }
    .mk-stamp { background: var(--ng-amber); color: var(--ng-on-acc); border: 0; outline: 1.5px solid color-mix(in srgb, var(--ng-on-acc) 35%, transparent); outline-offset: -8px; border-radius: 3px; box-shadow: 0 0 34px color-mix(in srgb, var(--ng-amber) 50%, transparent), 0 18px 40px rgba(0,0,0,.6); }
    .mk-cmp.wrong .mk-stamp { background: var(--ng-coral); color: #FFFFFF; outline-color: rgba(255,255,255,.4); box-shadow: 0 0 34px color-mix(in srgb, var(--ng-coral) 50%, transparent), 0 18px 40px rgba(0,0,0,.6); }
    .mk-sticker { background: var(--ng-coral); color: #FFFFFF; border: 0; border-radius: 3px; box-shadow: 0 0 26px color-mix(in srgb, var(--ng-coral) 50%, transparent), 0 10px 26px rgba(0,0,0,.55); }
    .mk-tape { border: 1.5px solid var(--ng-jade); background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ng-jade) 45%, transparent) 0 2px, transparent 2px 10px); box-shadow: 0 0 14px color-mix(in srgb, var(--ng-jade) 35%, transparent); opacity: 1; }
    .mk-arrow { color: var(--ng-cyan); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--ng-cyan) 60%, transparent)); }
    .mk-file .ic, .mk-plate .ic { color: var(--ng-a, var(--ng-cyan)); }
    .mk-file .ear { background: linear-gradient(225deg, var(--ng-bg) 0 50%, var(--ng-a, var(--ng-cyan)) 50% calc(50% + 2px), color-mix(in srgb, var(--ng-a, var(--ng-cyan)) 28%, transparent) calc(50% + 2px)); }
    .mk-ai { border-color: var(--ng-jade) !important; }
    .mk-ai b { text-shadow: 0 0 30px color-mix(in srgb, var(--ng-jade) 60%, transparent); }
    .mk-ai .mini u { border-width: 1.5px; }
    .mk-cmp .rw i { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--ng-a); box-shadow: 0 0 10px var(--ng-a); }
    .mk-cmp .badge { color: var(--ng-on-acc); background: var(--ng-jade); border: 0; border-radius: 3px; box-shadow: 0 0 22px var(--ng-jade); }
    .mk-cmp .btn { background: color-mix(in srgb, var(--ng-bg) 70%, #000); color: var(--ng-text); border: 2px solid var(--ng-cyan); border-bottom-width: 7px; border-radius: 3px; box-shadow: 0 0 18px color-mix(in srgb, var(--ng-cyan) 35%, transparent); }
    .mk-cmp .sw { border: 1.5px solid color-mix(in srgb, var(--ng-text) 25%, transparent); border-radius: 3px; }
    .mk-cmp .sw i { border-left-width: 1.5px; border-left-color: color-mix(in srgb, var(--ng-bg) 60%, #000); }
    .mk-cmp .tlx { border: 1px solid color-mix(in srgb, var(--ng-text) 14%, transparent); background: color-mix(in srgb, var(--ng-bg) 70%, #000); border-radius: 0; }
    .mk-cmp .tlx .trk { border-bottom: 1px solid color-mix(in srgb, var(--ng-text) 10%, transparent); }
    .mk-cmp .tlx .clp { border: 1.5px solid var(--ng-a, var(--ng-cyan)); border-radius: 2px; }
    .mk-cmp .tlx .ph { width: 3px; background: var(--ng-coral); box-shadow: 0 0 10px var(--ng-coral); }
    .mk-vs .dm { border: 1.5px solid var(--ng-amber); box-shadow: 0 0 26px color-mix(in srgb, var(--ng-amber) 40%, transparent), var(--mk-sh-sm); }
    .mk-vs .tx { color: var(--ng-amber); text-shadow: 0 0 18px color-mix(in srgb, var(--ng-amber) 55%, transparent); }
    .mk-ripple { border: 2px solid var(--ng-jade); box-shadow: 0 0 18px var(--ng-jade); }
    .mk-cstat .lb { background: var(--ng-cyan); color: var(--ng-on-acc); border-radius: 2px; }
    .mk-cstat .num { text-shadow: 0 0 26px color-mix(in srgb, var(--ng-cyan) 40%, transparent); }
    .mk-cstat .pg { border: 1px solid color-mix(in srgb, var(--ng-text) 14%, transparent); border-radius: 0; }
    .mk-cstat .pg i { background: var(--ng-jade); box-shadow: 0 0 14px var(--ng-jade); }
    .mk-screw { border: 0; background: var(--ng-jade); box-shadow: 0 0 10px var(--ng-jade); }
    .mk-screw::after { display: none; }
    .mk-banner { border: 1.5px solid color-mix(in srgb, var(--ng-jade) 60%, transparent); border-left: 6px solid var(--ng-jade); box-shadow: var(--mk-sh), 0 0 30px color-mix(in srgb, var(--ng-jade) 22%, transparent); }
    .mk-cv-block { background-image: linear-gradient(color-mix(in srgb, var(--ng-cyan) 9%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--ng-cyan) 9%, transparent) 1px, transparent 1px); background-size: 30px 30px; }
    .mk-cv-title { text-shadow: 0 0 30px color-mix(in srgb, var(--ng-cyan) 25%, transparent); }
    .mk-cv-blue { color: var(--ng-violet); }
    .mk-cv-dots { background-image: radial-gradient(color-mix(in srgb, var(--ng-amber) 55%, transparent) 2.5px, transparent 2.5px); }
    .mk-cv-chip { border-width: 1.5px; border-color: var(--ng-a, var(--ng-cyan)); box-shadow: 0 0 18px color-mix(in srgb, var(--ng-a, var(--ng-cyan)) 35%, transparent); }
    .mk-cv-ring { border: 3px solid var(--ng-jade); box-shadow: 0 0 24px color-mix(in srgb, var(--ng-jade) 50%, transparent); }
    .mk-cv-ring::after { background: var(--ng-jade); opacity: .28; }
    .mk-cv-wave path { stroke: var(--ng-amber); stroke-width: 5; }
      /* v3.5 收尾（12 套打分）：「换风格」色块点击前用本包的亮色，不在深色卡上像三个空格 */
    :root { --mk-sw0: var(--ng-text); --mk-sw1: var(--ng-cyan); --mk-sw2: var(--ng-violet); --mk-sw3: var(--ng-amber); }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="ng-bg-layer"></div>
    <div id="camera-viewport"><div id="ng-world"></div></div>
    <div id="ng-vignette"></div>
    <div id="ng-wipe">
      <div class="ng-slab" style="--c:var(--ng-cyan);background:#0E1320;"></div>
      <div class="ng-slab" style="--c:var(--ng-violet);background:#0D111C;"></div>
      <div class="ng-slab" style="--c:var(--ng-amber);background:#0C1019;"></div>
      <div class="ng-slab top" style="--c:var(--ng-jade);">
        <div class="ng-exec"><div class="nh"><span class="hd">▶ EXECUTE · NODE</span><i></i></div><div class="no">01</div><div class="lb">—</div><div class="tr"><b></b></div></div>
      </div>
    </div>
    <div id="screen-layer"></div>
    <div id="ng-tabs"></div>

    <div id="avatar-stage">
      <img id="avatar-studio-bg" src="assets/studio_bg.png" alt="studio" />
      <svg id="avatar-silhouette" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet">
        <circle cx="200" cy="150" r="92" fill="#0B1220" stroke="#38BDF8" stroke-width="4" />
        <path d="M30 520 C40 340 110 270 200 270 C290 270 360 340 370 520 Z" fill="#0B1220" stroke="#38BDF8" stroke-width="4" />
        <text x="200" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="900" fill="#38BDF8" letter-spacing="3">AVATAR · 人像占位</text>
      </svg>
      <div id="avatar-nh"><span>CAM_MONITOR · 1080P</span><b>REC</b><i></i></div>
      <div id="avatar-tag"><i></i><span id="avatar-tag-tx">YOUR NAME</span></div>
    </div>

    <canvas id="avatar-morph-canvas" width="1920" height="1080"></canvas>
    <div id="subtitle-bar"></div>
    <div id="load-error"></div>
  </div>

  <div id="hud">
    <button id="btn-play" class="primary">▶ 连播 10 大句型</button>
    <button id="btn-replay">↺ 重播</button>
    <input id="scrubber" type="range" min="0" max="50" step="0.01" value="0" />
    <span id="time-readout">0.00 / 0.00s</span>
    <span class="hud-sep"></span>
    <span class="hud-label">H 隐藏控制栏 · 1–9 / 0 切换句型 · 空格播放</span>
  </div>

  <script src="../../core/vendor/gsap.min.js"></script>
  <script src="../../core/camera-rig.js"></script>
  <script src="../../core/avatar-morph-fx.js"></script>
  <script src="../../core/avatar.js"></script>
  <script src="../../core/subtitle.js"></script>
  <script src="../../core/script-sync.js"></script>
  <script src="../../core/talk.js"></script>
  <script src="../../core/focus.js"></script>
  <script src="../../core/cue-kit.js"></script>
  <script src="../../core/host-kit.js"></script>
  <script src="components.js"></script>
  <script src="themes.js"></script>
  <script>
    const vp = document.getElementById('viewport');
    function fit() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      vp.style.transform = `scale(${s})`;
      vp.style.left = `${(window.innerWidth - 1920 * s) / 2}px`;
      vp.style.top = `${(window.innerHeight - 1080 * s) / 2}px`;
    }
    window.addEventListener('resize', fit); fit();

    const ZONE_GAP = 600, ZONE_Y = 100, SX = 650, SY = 470;
    // 组件局部安全区 x60–1340 / y100–980 → 屏幕 x≈115–1295（避开人像框 1328+）/ y≈100–910（避开字幕）
    const CAM_DX = 60, CAM_ZOOM = 0.92;
    const params = new URLSearchParams(location.search);
    // v3.5：牌子层 04 造型（印章 = 琥珀实色信号芯片、贴纸 = 珊瑚报错芯片、标签 = 暗色节点头条 + 翡翠左灯条、多色大字 = 霓虹字 + 暗描边发光；全部不歪）
    MHEngine.Badges.registerKinds('04', {
      stamp: 'padding:10px 30px 12px;background:var(--ng-amber);color:var(--ng-on-acc);border-radius:3px;outline:1.5px solid color-mix(in srgb,var(--ng-on-acc) 35%,transparent);outline-offset:-8px;box-shadow:0 0 34px color-mix(in srgb,var(--ng-amber) 50%,transparent),0 18px 40px rgba(0,0,0,.6);font-family:var(--ng-font-cn);font-weight:900;',
      sticker: 'padding:12px 28px 14px;background:color-mix(in srgb,var(--ng-bg) 70%,#000);color:var(--ng-coral);border:2px solid var(--ng-coral);border-radius:3px;box-shadow:0 0 26px color-mix(in srgb,var(--ng-coral) 40%,transparent),0 12px 30px rgba(0,0,0,.55);font-family:var(--ng-font-cn);font-weight:900;',
      tag: 'padding:12px 28px 14px 24px;background:var(--ng-node);color:var(--ng-text);border:1.5px solid color-mix(in srgb,var(--ng-cyan) 45%,transparent);border-left:7px solid var(--ng-jade);border-radius:3px;box-shadow:0 18px 42px rgba(0,0,0,.55),0 0 28px color-mix(in srgb,var(--ng-cyan) 20%,transparent);font-family:var(--ng-font-cn);font-weight:900;',
      label: 'padding:14px 34px 16px 28px;background:var(--ng-node);color:var(--ng-text);border:1.5px solid var(--ng-cyan);border-left:7px solid var(--ng-cyan);border-radius:3px;box-shadow:0 22px 50px rgba(0,0,0,.6),0 0 32px color-mix(in srgb,var(--ng-cyan) 28%,transparent);font-family:var(--ng-font-cn);font-weight:900;',
      big: { pal: ['var(--ng-jade)', 'var(--ng-cyan)', 'var(--ng-amber)', 'var(--ng-violet)'], ink: 'var(--ng-bg)', shadow: '0 0 30px rgba(56,189,248,.4)' },
      rot: { stamp: 0, sticker: 0, tag: 0, label: 0, big: 0 }
    });
    // v3.5：「换风格」按钮点完换上的色块 = 04 自己的 4 套皮肤（深空赛博 / 黑客矩阵 / 核能琥珀 / 白昼蓝图）
    MHEngine.CueKit.swatches = [['#0A0D14', '#38BDF8', '#A78BFA', '#00E5C3'], ['#060B08', '#00FF88', '#00D4FF', '#B8FF4D'], ['#120F0C', '#FF9F1C', '#FF4D4D', '#FFD166'], ['#F1F5F9', '#2563EB', '#059669', '#7C3AED']];

    /** 把每段 sub[] 均匀铺成 core/subtitle.js 需要的 WORD_DATA（中文逐字、英文/数字成词） */
    function buildWordData(scenes) {
      const words = [], lines = [];
      scenes.forEach((sc) => {
        if (MHEngine.ScriptSync.pushWords(sc, words, lines)) return; // 真实词级时间轴优先，否则均分
        const subs = sc.sub || []; if (!subs.length) return;
        const a0 = sc.start + 0.35, a1 = sc.start + sc.dur - 0.3, slot = (a1 - a0) / subs.length;
        subs.forEach((line, li) => {
          const toks = line.match(/[A-Za-z0-9.\-_/@#:+]+|\s+|./g) || [];
          const real = toks.filter((x) => !/^\s+$/.test(x));
          const s0 = a0 + li * slot, dt = (slot - 0.25) / Math.max(1, real.length);
          const a = words.length, sp = [];
          let k = 0;
          toks.forEach((tk) => {
            if (/^\s+$/.test(tk)) { if (words.length > a) sp.push(words.length - 1); return; }
            words.push([tk, +(s0 + k * dt).toFixed(3), +(s0 + (k + 1) * dt).toFixed(3)]); k++;
          });
          if (words.length > a) lines.push({ a, b: words.length - 1, sp });
        });
      });
      return { words, lines };
    }

    async function boot() {
      let script;
      try {
        const src = params.get('data') || 'demo_data.json';
        script = await (await fetch(src, { cache: 'no-store' })).json();
        MHEngine.ScriptSync.resolveMedia(script, src); // v3.4：媒体路径以剧本文件为基准
      } catch (e) {
        const el = document.getElementById('load-error');
        el.style.display = 'block'; el.textContent = '剧本 JSON 加载失败：请用 python core/tools/serve.py 通过 HTTP 打开本页。';
        throw e;
      }
      const theme = script.theme || {};
      const root = document.documentElement.style;
      ['bg', 'node', 'text', 'cyan', 'violet', 'jade', 'amber', 'coral'].forEach((k) => { if (theme[k]) root.setProperty(`--ng-${k}`, theme[k]); });
      NodeGraph.injectCSS();
      // 换肤：URL ?theme= ＞ 剧本 theme.preset ＞ cyber（cyber = 不覆盖，无参数访问与原版逐像素一致）
      if (window.NodeGraphThemes) NodeGraphThemes.init(script);
      const HK = MHEngine.HostKit.init(script, document.getElementById('avatar-stage'));   // v3.5：铺满版式 / 画框 / 利落散聚 / 牌子层（剧本写了才开）

      // 人像：可选真人视频，否则用剪影占位
      const meta = script.meta || {}, av = meta.avatar || {};
      if (av.bg) document.getElementById('avatar-studio-bg').src = av.bg;
      document.getElementById('avatar-tag-tx').textContent = av.tag || (av.video ? '' : 'YOUR NAME');
      if (av.video && !String(av.tag || '').trim()) document.getElementById('avatar-tag').style.display = 'none';   // v3.5：真人素材没填名牌 → 整块不出（占位剪影仍配占位名）
      if (HK.CHROME_OFF) { const nh = document.getElementById('avatar-nh'); nh.querySelector('span').textContent = ''; nh.querySelector('b').textContent = '●'; }   // v3.5：导出时监视器头条不出英文
      if (av.video) {
        const v = document.createElement('video');
        v.id = 'avatar-video'; v.src = av.video; v.muted = true; v.playsInline = true; v.preload = 'auto';
        document.getElementById('avatar-stage').insertBefore(v, document.getElementById('avatar-nh'));
        document.getElementById('avatar-silhouette').style.display = 'none';
      }

      // 组装场景（每段一个蓝图分区，底部带分区水印）
      const world = document.getElementById('ng-world');
      const scenes = []; let acc = 0, zoneX = 0;
      const COVER_AT = HK.coverAt(script.scenes, 0.38);   // 电缆帘幕在段边界前 0.38s 开始盖
      (script.scenes || []).forEach((sc, i) => {
        const factory = NodeGraph.COMPONENTS[sc.type] || MHEngine.ScriptSync.coreComponent(sc.type);
        if (!factory) { console.warn('unknown scene type', sc.type); return; }
        const dur = sc.dur || 6;
        const ctx = MHEngine.ScriptSync.sceneCtx(sc, acc, dur);
        ctx.area = HK.area(sc, { CAM_DX, CAM_ZOOM, SX, SY }); ctx.coverAt = COVER_AT[i];
        const comp = MHEngine.CueKit.create(sc.type, sc.data, ctx) || factory.create(sc.data || {}, ctx);
        const badges = HK.badges(sc, comp, ctx, document.getElementById('screen-layer'));
        const zx = zoneX, zy = ZONE_Y; zoneX += (comp.w || 1400) + ZONE_GAP;
        if (comp.layer === 'screen') { comp.el.style.display = 'none'; document.getElementById('screen-layer').appendChild(comp.el); }
        else {
          comp.el.style.left = `${zx}px`; comp.el.style.top = `${zy}px`; world.appendChild(comp.el);
          const wm = document.createElement('div'); wm.className = 'ng-wm';
          wm.style.cssText = `left:${zx + 40}px;top:${zy + 960}px;font-size:150px;`;
          const wmTx = HK.CHROME_OFF ? (sc.label || '') : sc.type.toUpperCase();   // v3.5：导出时不出英文句型名
          wm.textContent = `${String(scenes.length + 1).padStart(2, '0')}${wmTx ? ` · ${wmTx}` : ''}`;
          world.appendChild(wm);
        }
        scenes.push({ ...sc, idx: i, start: acc, dur, comp, badges, zx, zy, avatar: sc.avatar || comp.avatar });
        acc += dur;
      });
      const DURATION = acc;
      world.style.width = `${zoneX + 1400}px`;
      document.getElementById('scrubber').max = DURATION;

      // 运镜关键帧：每段局部机位 → 世界坐标；段与段之间在电缆帘幕遮挡下硬切
      const kfs = [];
      scenes.forEach((s, i) => {
        const cams = s.comp.cams && s.comp.cams.length ? s.comp.cams : [{ t: 0, x: 700, y: 500, zoom: 1 }];
        cams.forEach((c, j) => {
          let t = s.start + Math.min(c.t, s.dur);
          if (j === cams.length - 1 && i < scenes.length - 1) t = s.start + s.dur - 0.002;
          kfs.push({ t, x: s.zx + c.x - CAM_DX, y: s.zy + c.y, zoom: (c.zoom || 1) * CAM_ZOOM, rx: c.rx || 0, ry: c.ry || 0, rz: c.rz || 0, screenX: SX, screenY: SY });
        });
      });
      const camRig = new MHEngine.CameraRig3D(world, { viewW: 1920, viewH: 1080, handheld: 0.6 });
      camRig.setKeyframes(kfs);

      // 人像形态：card / pip / corner / full（4 种形态全部支持 core 点阵粒子散聚转场）
      const avatar = new MHEngine.AvatarController(HK.presets({
        card:   { left: 1328, top: 82,  width: 540, height: 790, borderRadius: 3, borderWidth: 1.5, tagOpacity: 1 },
        pip:    { left: 1532, top: 642, width: 320, height: 320, borderRadius: 3, borderWidth: 1.5, tagOpacity: 0 },
        corner: { left: 1410, top: 530, width: 458, height: 342, borderRadius: 3, borderWidth: 1.5, tagOpacity: 1 }
      }));
      const mapAv = (m) => m === 'full' ? 'fullscreen' : (m === 'pip' || m === 'corner' ? m : 'card');
      const avatarMorph = new MHEngine.AvatarMorphFX(document.getElementById('avatar-morph-canvas'), avatar.presets);
      const tl = gsap.timeline({ paused: true });
      const AVSEG = MHEngine.ScriptSync.avatarSegments(scenes); // 无 avatarCues 时与 scenes 一一对应
      avatar.setImmediate(scenes[0] ? mapAv(scenes[0].avatar) : 'card');
      if (!HK.scheduleMorphs({ segs: AVSEG, avatar, morph: avatarMorph, tl, mapAv, seed: 40400 })) AVSEG.forEach((s, i) => {
        if (i === 0) return;
        const prev = mapAv(AVSEG[i - 1].avatar);
        const cur = mapAv(s.avatar);
        if (prev !== cur) {
          avatarMorph.addMorph({ time: s.start + 0.02, duration: 0.5, fromMode: prev, toMode: cur, count: 1000, seed: 40400 + i });
          avatar.animateOnTimeline(tl, cur, s.start + 0.06, 0.48);
        }
      });
      tl.to({}, { duration: 0.05 }, DURATION);

      // 字幕
      const WORD_DATA = buildWordData(scenes);
      window.WORD_DATA = WORD_DATA;
      const subtitle = new MHEngine.SubtitleRenderer(document.getElementById('subtitle-bar'), WORD_DATA);

      // 顶部 QUEUE 队列标签
      const tabsEl = document.getElementById('ng-tabs');
      scenes.forEach((s, i) => {
        const tb = document.createElement('div'); tb.className = 'ng-tab';
        tb.innerHTML = `<i></i>${String(i + 1).padStart(2, '0')} ${s.type.toUpperCase()}<div class="tr"><div class="fl"></div></div>`;
        tb.addEventListener('click', () => jumpTo(i));
        tabsEl.appendChild(tb); s.tab = tb;
      });

      const wipe = document.getElementById('ng-wipe');
      const slabs = Array.from(wipe.querySelectorAll('.ng-slab'));
      const execNo = wipe.querySelector('.ng-exec .no'), execLb = wipe.querySelector('.ng-exec .lb'), execHd = wipe.querySelector('.ng-exec .hd'), execTr = wipe.querySelector('.ng-exec .tr b');
      const bg = document.getElementById('ng-bg-layer');
      const stageEl = document.getElementById('avatar-stage');
      const camViewport = document.getElementById('camera-viewport');
      const vign = document.getElementById('ng-vignette');
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const easeOut = (x) => 1 - Math.pow(1 - x, 3), easeIn = (x) => x * x * x;

      function updateUI(t) {
        MHEngine.ScriptSync.renderCues(script, t);
        tl.time(Math.min(t, DURATION));
        camRig.render(t);
        subtitle.render(t);
        // 蓝图点阵缓慢视差漂移（纯 transform，确定性）
        bg.style.transform = `translate(${(18 * Math.sin(t * 0.19)).toFixed(1)}px, ${(12 * Math.cos(t * 0.15)).toFixed(1)}px)`;

        let cur = scenes.length - 1;
        scenes.forEach((s, i) => { if (t >= s.start && t < s.start + s.dur) cur = i; });
        scenes.forEach((s, i) => {
          if (Math.abs(i - cur) <= 1) s.comp.update(t - s.start);
          if (s.comp.layer === 'screen') s.comp.el.style.display = i === cur ? 'block' : 'none';
          s.tab.classList.toggle('on', i === cur);
          s.tab.classList.toggle('done', i < cur);
          s.tab.querySelector('.fl').style.width = `${(clamp01((t - s.start) / s.dur) * 100).toFixed(1)}%`;
        });
        const S = scenes[cur];
        const AS = MHEngine.ScriptSync.avatarAt(AVSEG, t, S);
        const isFull = AS.avatar === 'full';
        stageEl.classList.toggle('is-full', isFull && t >= AS.start + HK.fullDelay(0.2));
        stageEl.classList.toggle('is-pip', AS.avatar === 'pip' && t >= AS.start + HK.fullDelay(0.1));
        stageEl.classList.toggle('is-corner', AS.avatar === 'corner' && t >= AS.start + HK.fullDelay(0.1));
        const hideWorld = isFull && t >= AS.start + HK.fullDelay(0.15) && t < AS.start + AS.dur;
        HK.updateBadges(scenes, cur, t);
        camViewport.style.opacity = hideWorld ? '0' : '1';
        vign.style.opacity = hideWorld ? '0' : '1';

        // 四色霓虹电缆帘幕：依次盖上（翡翠层在最上带 EXECUTE 节点卡）→ 反序抽离
        let shown = false;
        for (let i = 1; i < scenes.length; i++) {
          const b = scenes[i].start;
          if (t >= b - 0.38 && t < b + 0.46) {
            slabs.forEach((sl, k) => {
              let x;
              if (t < b) x = 1980 * (1 - easeOut(clamp01((t - (b - 0.38) - k * 0.045) / 0.2)));
              else x = -2240 * easeIn(clamp01((t - b - (3 - k) * 0.05) / 0.26));
              sl.style.transform = `translateX(${x.toFixed(1)}px)`;
            });
            execNo.textContent = String(i + 1).padStart(2, '0');
            execLb.textContent = HK.label(scenes[i]);
            // v3.5：导出时（?chrome=0）头条不出 EXECUTE / 英文句型名，换成 ▶ 段号 / 总段数
            execHd.textContent = HK.CHROME_OFF ? `▶ ${String(i + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}` : `▶ EXECUTE · ${scenes[i].type.toUpperCase()}`;
            execTr.style.transform = `scaleX(${clamp01((t - (b - 0.2)) / 0.4).toFixed(3)})`;
            wipe.style.display = 'block'; shown = true; break;
          }
        }
        if (!shown) wipe.style.display = 'none';

        stageEl.style.opacity = avatarMorph.render(t).toFixed(3);
        HK.frame(t, stageEl, avatarMorph);
        document.getElementById('scrubber').value = t.toFixed(2);
        document.getElementById('time-readout').textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)}s · ${String(cur + 1).padStart(2, '0')} ${S.type}`;
      }

      // 播放时钟（无音轨，按 performance.now 推进；有 avatar.video 时同步视频）
      let playing = false, t0 = 0, tStart = 0, cur = 0, raf = null;
      const vid = document.getElementById('avatar-video');
      const CLOCK = MHEngine.ScriptSync.mediaClock({ meta, duration: DURATION, video: vid, scenes }); // meta.avatar.offset + meta.audio
      function seek(t) {
        cur = Math.max(0, Math.min(DURATION, t)); updateUI(cur);
        scenes.forEach((s) => { const m = s.comp.media; if (m && m.tagName === 'VIDEO') { try { m.currentTime = Math.max(0, cur - s.start - 0.3) % (m.duration || 1e9); } catch (_) {} } });
        CLOCK.seek(cur);
        if (playing) { t0 = performance.now(); tStart = cur; }
      }
      function loop() {
        if (!playing) return;
        const t = CLOCK.now(tStart + (performance.now() - t0) / 1000); CLOCK.follow(t);
        if (t >= DURATION) { pause(); seek(DURATION); return; }
        cur = t; updateUI(t); raf = requestAnimationFrame(loop);
      }
      function play() { if (cur >= DURATION - 0.05) cur = 0; playing = true; t0 = performance.now(); tStart = cur; CLOCK.play(cur); scenes.forEach((s) => s.comp.media && s.comp.media.play && s.comp.media.play().catch(() => {})); document.getElementById('btn-play').textContent = '⏸ 暂停'; raf = requestAnimationFrame(loop); }
      function pause() { playing = false; cancelAnimationFrame(raf); CLOCK.pause(); scenes.forEach((s) => s.comp.media && s.comp.media.pause && s.comp.media.pause()); document.getElementById('btn-play').textContent = '▶ 连播 10 大句型'; }
      function jumpTo(i) { seek(scenes[i].start + 0.45); }

      document.getElementById('btn-play').addEventListener('click', () => playing ? pause() : play());
      document.getElementById('btn-replay').addEventListener('click', () => { seek(0); play(); });
      document.getElementById('scrubber').addEventListener('input', (e) => { pause(); seek(parseFloat(e.target.value)); });
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
        else if (e.key === 'h' || e.key === 'H') document.getElementById('hud').classList.toggle('hidden');
        else if (/^[0-9]$/.test(e.key)) { const k = e.key === '0' ? 9 : +e.key - 1; if (scenes[k]) jumpTo(k); }
      });

      window.__MH_ENGINE__ = { duration: DURATION, seek, play, pause, time: () => cur, isPlaying: () => playing, scenes: scenes.map((s) => ({ type: s.type, start: s.start, dur: s.dur })) };
      if (params.get('clean') === '1') document.getElementById('hud').classList.add('hidden');
      seek(params.has('t') ? parseFloat(params.get('t')) : 0);
    }
    boot();
  </script>
</body>
