<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiss Print Collage · 组件展厅（风格包 02）</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../core/engine.css" />
  <style>
    :root {
      --sp-font-cn: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --sp-font-latin: 'Helvetica Neue', 'Arial', 'Noto Sans SC', sans-serif;
      --sp-font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      --sp-paper: #EDE8DC; --sp-sheet: #F7F4EC; --sp-sheet-2: #FBF9F3;
      --sp-red: #D92323; --sp-ink: #141414; --sp-grey: #5B564C;
      --sp-shadow: 0 1px 1px rgba(20,20,20,0.10), 0 10px 18px -8px rgba(20,20,20,0.30), 0 26px 44px -22px rgba(20,20,20,0.30);
      --sp-shadow-lg: 0 2px 2px rgba(20,20,20,0.10), 0 18px 30px -12px rgba(20,20,20,0.34), 0 46px 80px -34px rgba(20,20,20,0.38);
    }
    #viewport { background: var(--sp-paper); overflow: hidden; font-family: var(--sp-font-cn); color: var(--sp-ink); }
    #avatar-morph-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 32; pointer-events: none; }

    /* 3D 网格纸世界 */
    #camera-viewport { position: absolute; inset: 0; z-index: 10; overflow: hidden; perspective: 1650px; pointer-events: none; background: var(--sp-paper); }
    #paper-world {
      position: absolute; left: 0; top: 0; width: 11200px; height: 1300px; transform-style: preserve-3d; will-change: transform;
      background-color: var(--sp-paper);
      background-image: linear-gradient(90deg, rgba(20,20,20,0.085) 1px, transparent 1px), linear-gradient(rgba(20,20,20,0.035) 1px, transparent 1px);
      background-size: 110px 100%, 100% 55px;
    }
    .col-no { position: absolute; top: 34px; font-family: var(--sp-font-mono); font-size: 13px; font-weight: 700; color: rgba(20,20,20,0.42); }
    .col-no.bot { top: auto; bottom: 30px; }
    #paper-grain {
      position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: 0.5; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.32  0 0 0 0.22 0'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>");
    }

    /* 整页抽纸转场 */
    #pull-sheet {
      position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 15; pointer-events: none; display: none;
      background-color: var(--sp-paper);
      background-image: linear-gradient(90deg, rgba(20,20,20,0.085) 1px, transparent 1px), linear-gradient(rgba(20,20,20,0.035) 1px, transparent 1px);
      background-size: 110px 100%, 100% 55px;
      box-shadow: -40px 0 70px rgba(20,20,20,0.45), 40px 0 70px rgba(20,20,20,0.45);
    }
    #pull-sheet .ps-no { position: absolute; left: 90px; top: 330px; font-family: var(--sp-font-latin); font-size: 300px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; color: var(--sp-red); }
    #pull-sheet .ps-lb { position: absolute; left: 100px; top: 650px; font-size: 64px; font-weight: 900; color: var(--sp-ink); }

    /* 屏幕层（全屏人像上的纸片） */
    #screen-layer { position: absolute; inset: 0; z-index: 26; pointer-events: none; }

    /* 顶部 7 段可点击句型标签（兼作进度条） */
    #sp-tabs { position: absolute; left: 40px; top: 22px; z-index: 45; display: flex; gap: 4px; background: var(--sp-sheet); box-shadow: var(--sp-shadow); padding: 7px 8px; }
    .sp-tab { width: 118px; position: relative; padding: 2px 6px 10px; font-family: var(--sp-font-mono); font-size: 12px; font-weight: 800; color: rgba(20,20,20,0.45); cursor: pointer; white-space: nowrap; }
    .sp-tab.on { color: var(--sp-ink); }
    .sp-tab .tr { position: absolute; left: 6px; right: 6px; bottom: 2px; height: 4px; background: rgba(20,20,20,0.14); }
    .sp-tab .fl { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--sp-red); }

    /* 人像：直角印刷相框 + 剪影占位 */
    html:not([data-mh-pip="circle"]) #avatar-stage { border-radius: 0 !important; }
    #avatar-stage { border-style: solid !important; border-color: var(--sp-ink) !important; box-shadow: var(--sp-shadow-lg) !important; }
    #avatar-stage.is-full { border-width: 0 !important; box-shadow: none !important; }
    #avatar-silhouette { position: absolute; left: 50%; bottom: 0; height: 82%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
    #avatar-tag { background: var(--sp-ink) !important; color: var(--sp-sheet) !important; border: 0 !important; border-radius: 0 !important; font-family: var(--sp-font-mono) !important; font-weight: 800 !important; font-size: 14px !important; letter-spacing: 0.12em !important; padding: 8px 16px !important; box-shadow: none !important; }
    #avatar-tag i { display: inline-block; width: 10px; height: 10px; background: var(--sp-red); margin-right: 10px; }

    /* 瑞士印刷字幕条：米白直角纸条 + 左 6px 瑞士红竖条 + 油墨黑粗体 + 红色逐字高亮 */
    #subtitle-bar {
      bottom: 38px !important; background: #F7F4EC !important; border: 0 !important; border-left: 6px solid #D92323 !important; border-radius: 0 !important;
      backdrop-filter: none !important; box-shadow: 0 1px 1px rgba(20,20,20,0.14), 0 10px 22px -6px rgba(20,20,20,0.34) !important;
      padding: 12px 34px 13px 30px !important; color: #141414 !important; font-family: var(--sp-font-cn) !important;
      font-size: 40px !important; font-weight: 900 !important; letter-spacing: 0.03em !important;
    }
    #subtitle-bar .w { color: #141414; text-shadow: none; }
    #subtitle-bar .w.passed { color: #141414 !important; text-shadow: none !important; }
    #subtitle-bar .w.active { color: #D92323 !important; text-shadow: none !important; }

    #load-error { position: absolute; left: 80px; top: 200px; z-index: 99; font-size: 28px; font-weight: 900; color: var(--sp-red); display: none; }

    /* v3.5 · 跟词组件（core/cue-kit.js）的 02 造型：直角无边纸片 + 印刷软投影 + 瑞士红 / 油墨黑 / 灰，几乎不歪（只在剧本写了新字段时出现） */
    :root {
      --mk-ink: var(--sp-ink); --mk-paper: var(--sp-paper); --mk-panel: var(--sp-sheet-2); --mk-muted: #DCD5C4; --mk-muted-ink: var(--sp-grey);
      --mk-c1: var(--sp-sheet); --mk-on1: var(--sp-ink); --mk-c2: var(--sp-ink); --mk-on2: var(--sp-sheet);
      --mk-c3: var(--sp-red); --mk-on3: #FFFFFF; --mk-c4: var(--sp-grey); --mk-on4: var(--sp-sheet);
      --mk-accent: var(--sp-red); --mk-dark: var(--sp-ink); --mk-on-dark: var(--sp-sheet);
      --mk-bw: 0px; --mk-rad: 0px; --mk-sh: var(--sp-shadow); --mk-sh-lg: var(--sp-shadow-lg); --mk-sh-sm: var(--sp-shadow); --mk-tilt: 0.3;
      --mk-font: var(--sp-font-cn); --mk-font-num: var(--sp-font-latin);
      --mk-board: var(--sp-paper); --mk-board-tex: linear-gradient(90deg, rgba(20,20,20,0.085) 1px, transparent 1px); --mk-tape: rgba(247,244,236,.78);
      --mk-trim: rgba(20,20,20,.22); --mk-trim-c: rgba(20,20,20,.55);
      /* 全屏画框：裱在纸上的照片——3px 油墨细边 + 印刷软投影 + 轻暗角 */
      --mh-frame-bw: 3px; --mh-frame-color: var(--sp-ink); --mh-frame-shadow: var(--sp-shadow-lg); --mh-frame-radius: 0; --mh-frame-vig: .2;
    }
    .mk-zone .mh-focus-ring { inset: -14px; border: 5px solid var(--sp-red); box-shadow: none; }
    html[data-mh-card="trim"] .mk-zone .mh-focus-ring:not(.row) { box-shadow: 0 0 30px 6px rgba(217,35,35,.22); }
    .mk-stamp { background: var(--sp-sheet); color: var(--sp-red); border: 6px double var(--sp-red); outline: none; box-shadow: var(--sp-shadow); }   /* v3.5 收尾：纸底印戳（压在红色块 / 人像上也看得清） */
    .mk-sticker { border: 0; box-shadow: var(--sp-shadow); }
    .mk-tape { border: 0; background-image: none; box-shadow: 0 1px 3px rgba(20,20,20,.18); }
    .mk-cmp .rw i, .mk-cmp .badge, .mk-ticket .pgb, .mk-cstat .pg, .mk-cmp .sw, .mk-cmp .btn { border-width: 2px; }
    .mk-cv-ring { border-color: var(--sp-red); box-shadow: none; }
    .mk-cv-ring::after { background: var(--sp-red); }
    .mk-cv-dots { background-image: radial-gradient(rgba(247,244,236,.35) 3px, transparent 3px); }
    .mk-cv-chip { border: 0; box-shadow: var(--sp-shadow); }
    .mk-screw { border-width: 2px; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="camera-viewport"><div id="paper-world"></div></div>
    <div id="paper-grain"></div>
    <div id="pull-sheet"><div class="ps-no">01</div><div class="ps-lb">—</div></div>
    <div id="screen-layer"></div>
    <div id="sp-tabs"></div>

    <div id="avatar-stage">
      <img id="avatar-studio-bg" src="assets/studio_bg.png" alt="studio" />
      <svg id="avatar-silhouette" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet">
        <circle cx="200" cy="150" r="92" fill="rgba(20,20,20,0.72)" />
        <path d="M30 520 C40 340 110 270 200 270 C290 270 360 340 370 520 Z" fill="rgba(20,20,20,0.72)" />
        <text x="200" y="430" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="800" fill="#EDE8DC" letter-spacing="3">AVATAR · 人像占位</text>
      </svg>
      <div id="avatar-tag"><i></i><span id="avatar-tag-tx">YOUR NAME</span></div>
    </div>

    <canvas id="avatar-morph-canvas" width="1920" height="1080"></canvas>
    <div id="subtitle-bar"></div>
    <div id="load-error"></div>
  </div>

  <div id="hud">
    <button id="btn-play" class="primary">▶ 连播 10 大句型</button>
    <button id="btn-replay">↺ 重播</button>
    <input id="scrubber" type="range" min="0" max="50" step="0.01" value="0" />
    <span id="time-readout">0.00 / 0.00s</span>
    <span class="hud-sep"></span>
    <span class="hud-label">H 隐藏控制栏 · 1–9 / 0 切换句型 · 空格播放</span>
  </div>

  <script src="../../core/vendor/gsap.min.js"></script>
  <script src="../../core/camera-rig.js"></script>
  <script src="../../core/avatar-morph-fx.js"></script>
  <script src="../../core/avatar.js"></script>
  <script src="../../core/subtitle.js"></script>
  <script src="../../core/script-sync.js"></script>
  <script src="../../core/talk.js"></script>
  <script src="../../core/focus.js"></script>
  <script src="../../core/cue-kit.js"></script>
  <script src="../../core/host-kit.js"></script>
  <script src="components.js"></script>
  <script src="themes.js"></script>
  <script>
    const vp = document.getElementById('viewport');
    function fit() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      vp.style.transform = `scale(${s})`;
      vp.style.left = `${(window.innerWidth - 1920 * s) / 2}px`;
      vp.style.top = `${(window.innerHeight - 1080 * s) / 2}px`;
    }
    window.addEventListener('resize', fit); fit();

    const ZONE_GAP = 200, ZONE_Y = 100, SX = 650, SY = 470;
    // 组件局部安全区 x60–1340 / y100–980 → 屏幕 x≈115–1295（避开人像框 1328+）/ y≈100–910（避开字幕）
    const CAM_DX = 60, CAM_ZOOM = 0.92;
    const params = new URLSearchParams(location.search);
    // v3.5：牌子层 02 造型（印章 = 红色双线印戳、标签 = 油墨黑纸条、多色大字 = 红黑无描边；全部不歪）
    MHEngine.Badges.registerKinds('02', {
      stamp: 'padding:10px 30px 12px;background:var(--sp-sheet);color:var(--sp-red);border:7px double var(--sp-red);box-shadow:var(--sp-shadow-lg);font-family:var(--sp-font-cn);font-weight:900;',
      sticker: 'padding:12px 28px 14px;background:var(--sp-red);color:#FFFFFF;box-shadow:var(--sp-shadow);font-family:var(--sp-font-cn);font-weight:900;',
      tag: 'padding:12px 26px 14px;background:var(--sp-ink);color:var(--sp-sheet);border-left:10px solid var(--sp-red);box-shadow:var(--sp-shadow);font-family:var(--sp-font-cn);font-weight:900;',
      label: 'padding:14px 34px 16px;background:var(--sp-sheet);color:var(--sp-ink);border-left:10px solid var(--sp-red);box-shadow:var(--sp-shadow-lg);font-family:var(--sp-font-cn);font-weight:900;',
      big: { pal: ['var(--sp-red)', 'var(--sp-ink)'], ink: 'transparent', shadow: 'none' },
      rot: { stamp: -4, sticker: 0, tag: 0, label: 0, big: 0 }
    });

    /** 把每段 sub[] 均匀铺成 core/subtitle.js 需要的 WORD_DATA（中文逐字、英文/数字成词） */
    function buildWordData(scenes) {
      const words = [], lines = [];
      scenes.forEach((sc) => {
        if (MHEngine.ScriptSync.pushWords(sc, words, lines)) return; // 真实词级时间轴优先，否则均分
        const subs = sc.sub || []; if (!subs.length) return;
        const a0 = sc.start + 0.35, a1 = sc.start + sc.dur - 0.3, slot = (a1 - a0) / subs.length;
        subs.forEach((line, li) => {
          const toks = line.match(/[A-Za-z0-9.\-_/@#:+]+|\s+|./g) || [];
          const real = toks.filter((x) => !/^\s+$/.test(x));
          const s0 = a0 + li * slot, dt = (slot - 0.25) / Math.max(1, real.length);
          const a = words.length, sp = [];
          let k = 0;
          toks.forEach((tk) => {
            if (/^\s+$/.test(tk)) { if (words.length > a) sp.push(words.length - 1); return; }
            words.push([tk, +(s0 + k * dt).toFixed(3), +(s0 + (k + 1) * dt).toFixed(3)]); k++;
          });
          if (words.length > a) lines.push({ a, b: words.length - 1, sp });
        });
      });
      return { words, lines };
    }

    async function boot() {
      let script;
      try {
        const src = params.get('data') || 'demo_data.json';
        script = await (await fetch(src, { cache: 'no-store' })).json();
        MHEngine.ScriptSync.resolveMedia(script, src); // v3.4：媒体路径以剧本文件为基准
      } catch (e) {
        const el = document.getElementById('load-error');
        el.style.display = 'block'; el.textContent = '剧本 JSON 加载失败：请用 python core/tools/serve.py 通过 HTTP 打开本页。';
        throw e;
      }
      const theme = script.theme || {};
      const root = document.documentElement.style;
      if (theme.paper) root.setProperty('--sp-paper', theme.paper);
      if (theme.sheet) root.setProperty('--sp-sheet', theme.sheet);
      if (theme.red) root.setProperty('--sp-red', theme.red);
      if (theme.ink) root.setProperty('--sp-ink', theme.ink);
      SwissPrint.injectCSS();
      // 换肤：URL ?theme= ＞ 剧本 theme.preset ＞ classic（classic = 不覆盖，无参数访问与原版逐像素一致）
      if (window.SwissPrintThemes) SwissPrintThemes.init(script);
      const HK = MHEngine.HostKit.init(script, document.getElementById('avatar-stage'));   // v3.5：铺满版式 / 画框 / 利落散聚 / 牌子层（剧本写了才开）

      // 人像：可选真人视频，否则用剪影占位
      const meta = script.meta || {}, av = meta.avatar || {};
      if (av.bg) document.getElementById('avatar-studio-bg').src = av.bg;
      document.getElementById('avatar-tag-tx').textContent = av.tag || (av.video ? '' : 'YOUR NAME');
      if (av.video && !String(av.tag || '').trim()) document.getElementById('avatar-tag').style.display = 'none';   // v3.5：真人素材没填名牌 → 整块不出（占位剪影仍配占位名）
      if (av.video) {
        const v = document.createElement('video');
        v.id = 'avatar-video'; v.src = av.video; v.muted = true; v.playsInline = true; v.preload = 'auto';
        document.getElementById('avatar-stage').insertBefore(v, document.getElementById('avatar-tag'));
        document.getElementById('avatar-silhouette').style.display = 'none';
      }

      // 栏号
      const world = document.getElementById('paper-world');
      let cols = '';
      for (let k = 0; k * 110 < 24000; k++) { const n = String((k % 12) + 1).padStart(2, '0'); cols += `<div class="col-no" style="left:${k * 110 + 6}px;">${n}</div><div class="col-no bot" style="left:${k * 110 + 6}px;">${n}</div>`; }
      world.insertAdjacentHTML('afterbegin', cols);

      // 组装场景
      const scenes = []; let acc = 0, zoneX = 0;
      const COVER_AT = HK.coverAt(script.scenes, 0.34);   // 抽纸在段边界前 0.34s 开始盖
      (script.scenes || []).forEach((sc, i) => {
        const factory = SwissPrint.COMPONENTS[sc.type] || MHEngine.ScriptSync.coreComponent(sc.type);
        if (!factory) { console.warn('unknown scene type', sc.type); return; }
        const dur = sc.dur || 6;
        const ctx = MHEngine.ScriptSync.sceneCtx(sc, acc, dur);
        ctx.area = HK.area(sc, { CAM_DX, CAM_ZOOM, SX, SY }); ctx.coverAt = COVER_AT[i];
        const comp = MHEngine.CueKit.create(sc.type, sc.data, ctx) || factory.create(sc.data || {}, ctx);
        const badges = HK.badges(sc, comp, ctx, document.getElementById('screen-layer'));
        const zx = zoneX, zy = ZONE_Y; zoneX += (comp.w || 1400) + ZONE_GAP;
        if (comp.layer === 'screen') { comp.el.style.display = 'none'; document.getElementById('screen-layer').appendChild(comp.el); }
        else { comp.el.style.left = `${zx}px`; comp.el.style.top = `${zy}px`; world.appendChild(comp.el); }
        scenes.push({ ...sc, idx: i, start: acc, dur, comp, badges, zx, zy, avatar: sc.avatar || comp.avatar });
        acc += dur;
      });
      const DURATION = acc;
      world.style.width = `${zoneX + 1400}px`;
      document.getElementById('scrubber').max = DURATION;

      // 运镜关键帧：每段局部机位 → 世界坐标；段与段之间在抽纸遮挡下硬切
      const kfs = [];
      scenes.forEach((s, i) => {
        const cams = s.comp.cams && s.comp.cams.length ? s.comp.cams : [{ t: 0, x: 700, y: 500, zoom: 1 }];
        cams.forEach((c, j) => {
          let t = s.start + Math.min(c.t, s.dur);
          if (j === cams.length - 1 && i < scenes.length - 1) t = s.start + s.dur - 0.002;
          kfs.push({ t, x: s.zx + c.x - CAM_DX, y: s.zy + c.y, zoom: (c.zoom || 1) * CAM_ZOOM, rx: c.rx || 0, ry: c.ry || 0, rz: c.rz || 0, screenX: SX, screenY: SY });
        });
      });
      const camRig = new MHEngine.CameraRig3D(world, { viewW: 1920, viewH: 1080, handheld: 0.55 });
      camRig.setKeyframes(kfs);

      // 人像形态：card / pip / corner / full（4 种形态全部支持 core 点阵粒子散聚转场！）
      const avatar = new MHEngine.AvatarController(HK.presets({
        card:   { left: 1328, top: 82,  width: 540, height: 790, borderRadius: 0,   borderWidth: 3, tagOpacity: 1 },
        pip:    { left: 1532, top: 642, width: 320, height: 320, borderRadius: 160, borderWidth: 4, tagOpacity: 0 },
        corner: { left: 1410, top: 530, width: 458, height: 342, borderRadius: 0,   borderWidth: 3, tagOpacity: 1 }
      }));
      const mapAv = (m) => m === 'full' ? 'fullscreen' : (m === 'pip' || m === 'corner' ? m : 'card');
      const avatarMorph = new MHEngine.AvatarMorphFX(document.getElementById('avatar-morph-canvas'), avatar.presets);
      const tl = gsap.timeline({ paused: true });
      const AVSEG = MHEngine.ScriptSync.avatarSegments(scenes); // 无 avatarCues 时与 scenes 一一对应
      avatar.setImmediate(scenes[0] ? mapAv(scenes[0].avatar) : 'card');
      if (!HK.scheduleMorphs({ segs: AVSEG, avatar, morph: avatarMorph, tl, mapAv, seed: 20200 })) AVSEG.forEach((s, i) => {
        if (i === 0) return;
        const prev = mapAv(AVSEG[i - 1].avatar);
        const cur = mapAv(s.avatar);
        if (prev !== cur) {
          avatarMorph.addMorph({ time: s.start + 0.02, duration: 0.5, fromMode: prev, toMode: cur, count: 1000, seed: 20200 + i });
          avatar.animateOnTimeline(tl, cur, s.start + 0.06, 0.48);
        }
      });
      tl.to({}, { duration: 0.05 }, DURATION);

      // 字幕
      const WORD_DATA = buildWordData(scenes);
      window.WORD_DATA = WORD_DATA;
      const subtitle = new MHEngine.SubtitleRenderer(document.getElementById('subtitle-bar'), WORD_DATA);

      // 顶部句型标签
      const tabsEl = document.getElementById('sp-tabs');
      scenes.forEach((s, i) => {
        const tb = document.createElement('div'); tb.className = 'sp-tab';
        tb.innerHTML = `${String(i + 1).padStart(2, '0')} ${s.type.toUpperCase()}<div class="tr"><div class="fl"></div></div>`;
        tb.addEventListener('click', () => jumpTo(i));
        tabsEl.appendChild(tb); s.tab = tb;
      });

      const pull = document.getElementById('pull-sheet');
      const stageEl = document.getElementById('avatar-stage');
      const camViewport = document.getElementById('camera-viewport');
      const clamp01 = (x) => Math.max(0, Math.min(1, x));

      function updateUI(t) {
        MHEngine.ScriptSync.renderCues(script, t);
        tl.time(Math.min(t, DURATION));
        camRig.render(t);
        subtitle.render(t);
        let cur = scenes.length - 1;
        scenes.forEach((s, i) => { if (t >= s.start && t < s.start + s.dur) cur = i; });
        scenes.forEach((s, i) => {
          if (Math.abs(i - cur) <= 1) s.comp.update(t - s.start);
          if (s.comp.layer === 'screen') s.comp.el.style.display = i === cur ? 'block' : 'none';
          s.tab.classList.toggle('on', t >= s.start);
          s.tab.querySelector('.fl').style.width = `${(clamp01((t - s.start) / s.dur) * 100).toFixed(1)}%`;
        });
        const S = scenes[cur];
        const AS = MHEngine.ScriptSync.avatarAt(AVSEG, t, S);
        const isFull = AS.avatar === 'full';
        stageEl.classList.toggle('is-full', isFull && t >= AS.start + HK.fullDelay(0.2));
        camViewport.style.opacity = isFull && t >= AS.start + HK.fullDelay(0.15) && t < AS.start + AS.dur ? '0' : '1';
        HK.updateBadges(scenes, cur, t);

        // 整页抽纸：上一张纸带投影盖过 → 抽走
        let shown = false;
        for (let i = 1; i < scenes.length; i++) {
          const b = scenes[i].start;
          if (t >= b - 0.34 && t < b + 0.4) {
            const x = t < b ? 1960 * (1 - (1 - Math.pow(1 - clamp01((t - b + 0.34) / 0.34), 3))) : -1960 * Math.pow(clamp01((t - b) / 0.4), 2);
            pull.style.display = 'block';
            pull.style.transform = `translateX(${x.toFixed(1)}px) rotate(${(x / 1960 * -2).toFixed(2)}deg)`;
            pull.querySelector('.ps-no').textContent = String(i + 1).padStart(2, '0');
            pull.querySelector('.ps-no').style.display = HK.CHROME_OFF && !scenes[i].label ? 'none' : '';   // v3.5：导出时没写 label 不出段号 / 英文句型名
            pull.querySelector('.ps-lb').textContent = HK.label(scenes[i]);
            shown = true; break;
          }
        }
        if (!shown) pull.style.display = 'none';

        stageEl.style.opacity = avatarMorph.render(t).toFixed(3);
        HK.frame(t, stageEl, avatarMorph);
        document.getElementById('scrubber').value = t.toFixed(2);
        document.getElementById('time-readout').textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)}s · ${String(cur + 1).padStart(2, '0')} ${S.type}`;
      }

      // 播放时钟（无音轨，按 performance.now 推进；有 avatar.video 时同步视频）
      let playing = false, t0 = 0, tStart = 0, cur = 0, raf = null;
      const vid = document.getElementById('avatar-video');
      const CLOCK = MHEngine.ScriptSync.mediaClock({ meta, duration: DURATION, video: vid, scenes }); // meta.avatar.offset + meta.audio
      function seek(t) {
        cur = Math.max(0, Math.min(DURATION, t)); updateUI(cur);
        scenes.forEach((s) => { const m = s.comp.media; if (m && m.tagName === 'VIDEO') { try { m.currentTime = Math.max(0, cur - s.start - 0.3) % (m.duration || 1e9); } catch (_) {} } });
        CLOCK.seek(cur);
        if (playing) { t0 = performance.now(); tStart = cur; }
      }
      function loop() {
        if (!playing) return;
        const t = CLOCK.now(tStart + (performance.now() - t0) / 1000); CLOCK.follow(t);
        if (t >= DURATION) { pause(); seek(DURATION); return; }
        cur = t; updateUI(t); raf = requestAnimationFrame(loop);
      }
      function play() { if (cur >= DURATION - 0.05) cur = 0; playing = true; t0 = performance.now(); tStart = cur; CLOCK.play(cur); scenes.forEach((s) => s.comp.media && s.comp.media.play && s.comp.media.play().catch(() => {})); document.getElementById('btn-play').textContent = '⏸ 暂停'; raf = requestAnimationFrame(loop); }
      function pause() { playing = false; cancelAnimationFrame(raf); CLOCK.pause(); scenes.forEach((s) => s.comp.media && s.comp.media.pause && s.comp.media.pause()); document.getElementById('btn-play').textContent = '▶ 连播 10 大句型'; }
      function jumpTo(i) { seek(scenes[i].start + 0.45); }

      document.getElementById('btn-play').addEventListener('click', () => playing ? pause() : play());
      document.getElementById('btn-replay').addEventListener('click', () => { seek(0); play(); });
      document.getElementById('scrubber').addEventListener('input', (e) => { pause(); seek(parseFloat(e.target.value)); });
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
        else if (e.key === 'h' || e.key === 'H') document.getElementById('hud').classList.toggle('hidden');
        else if (/^[0-9]$/.test(e.key)) { const k = e.key === '0' ? 9 : +e.key - 1; if (scenes[k]) jumpTo(k); }
      });

      window.__MH_ENGINE__ = { duration: DURATION, seek, play, pause, time: () => cur, isPlaying: () => playing, scenes: scenes.map((s) => ({ type: s.type, start: s.start, dur: s.dur })) };
      if (params.get('clean') === '1') document.getElementById('hud').classList.add('hidden');
      seek(params.has('t') ? parseFloat(params.get('t')) : 0);
    }
    boot();
  </script>
</body>
</html>
